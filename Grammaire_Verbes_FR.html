TTjrppAfT0/q4M+d00kknnXTSSSedNEsncjrppJNOOumkk06apRM5nXTSSW9L53vRJ510CJ1D6UF0rnM66e3pHOtvS0/Q/qfFf0s6m/6t6Ub9P4fPo+n/AB9glNcCWhzdAAAAAElFTkSuQmCC\" alt=\"La maison d'être\">\n<div class=\"maison-list frex\">\n<span>naître ↔ mourir</span><span>aller ↔ venir</span><span>arriver ↔ partir</span><span>(r)entrer ↔ sortir</span><span>monter ↔ descendre</span><span>retourner · revenir</span><span>rester · tomber · passer</span>\n<span class=\"maison-plus\">+ tous les verbes pronominaux</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Auxiliaires</div><div class=\"slide-title\">« être » ou « avoir » ?</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">⚖️ Avec ou sans COD</span></div><div class=\"slide-body\">\n<table class=\"gtab\"><tr><th>Sans COD → « être »</th><th>Avec COD → « avoir »</th></tr>\n<tr><td class=\"frex\">Il <strong>est</strong> sorti dans la rue.</td><td class=\"frex\">Il <strong>a</strong> sorti le chien.</td></tr>\n<tr><td class=\"frex\">Nous <strong>sommes</strong> rentrés tôt.</td><td class=\"frex\">Nous <strong>avons</strong> rentré la voiture.</td></tr>\n<tr><td class=\"frex\">Ils <strong>sont</strong> passés devant la banque.</td><td class=\"frex\">Ils <strong>ont</strong> passé de bonnes vacances.</td></tr>\n<tr><td class=\"frex\">Elle <strong>est</strong> descendue à la cave.</td><td class=\"frex\">Elle <strong>a</strong> descendu la poubelle.</td></tr>\n<tr><td class=\"frex\">Je <strong>suis</strong> monté à pied.</td><td class=\"frex\">J'<strong>ai</strong> monté l'escalier.</td></tr>\n<tr><td class=\"frex\">Je <strong>suis</strong> retourné au bureau.</td><td class=\"frex\">J'<strong>ai</strong> retourné le matelas.</td></tr>\n</table>\n<div class=\"tip\">Avec un COD : <strong>descendre</strong> = porter en bas · <strong>monter</strong> = porter en haut · <strong>retourner</strong> = mettre à l'envers · <strong>entrer</strong> = porter à l'intérieur · <strong>rentrer</strong> = mettre à l'abri, ranger · <strong>sortir</strong> = porter dehors</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Semi-auxiliaires</div><div class=\"slide-title\">Les semi-auxiliaires</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">🔗 + infinitif</span></div><div class=\"slide-body\">\n<div class=\"rulebox\">Un semi-auxiliaire est suivi d'un <strong>infinitif</strong>.</div>\n<div class=\"qcat-grid\">\n  <div class=\"q-item\"><div class=\"q-bullet\">⏱</div><div class=\"q-text\"><strong>Le temps</strong> — <span class=\"frex\">aller · venir de</span></div></div>\n  <div class=\"q-item\"><div class=\"q-bullet\">💭</div><div class=\"q-text\"><strong>La modalité</strong> — <span class=\"frex\">devoir · vouloir · pouvoir</span></div></div>\n  <div class=\"q-item\"><div class=\"q-bullet\">⚙️</div><div class=\"q-text\"><strong>Autres</strong> — <span class=\"frex\">être en train de · savoir · faire · laisser</span></div></div>\n</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Voix passive</div><div class=\"slide-title\">La voix passive : formation</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">🔄 Formation</span></div><div class=\"slide-body\">\n<div class=\"rulebox\"><strong>« être »</strong> + <strong>participe passé</strong> + <strong>« par »</strong> + sujet de l'action</div>\n<div class=\"rulebox frex\">Les enfants <strong>sont vaccinés</strong> à l'école<br>Les enfants <strong>ont été vaccinés</strong> à l'école &nbsp;&nbsp;(<strong>par</strong> un médecin scolaire).<br>Les enfants <strong>seront vaccinés</strong> à l'école</div>\n<ul>\n<li>Le participe passé <strong>s'accorde toujours avec le sujet</strong> : <span class=\"frex\">Les salles ont été repein<strong>tes</strong>. Les moquettes ont été chang<strong>ées</strong>.</span></li>\n<li><strong>« De »</strong> remplace « par » avec <strong>aimer, connaître, respecter</strong> : <span class=\"frex\">Cette personne est aimée <strong>de</strong> tous, connue <strong>de</strong> tous, respectée <strong>de</strong> tous.</span></li>\n</ul>\n<div class=\"tip\">⚠️ On évite le passif quand le sujet de l'action est un pronom. Dites : <span class=\"frex\">J'ai fait ce dessin.</span> — Ne dites pas : <s class=\"frex\">Ce dessin a été fait par moi.</s></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Voix passive</div><div class=\"slide-title\">La voix passive : utilisation</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">🎯 Utilisation</span></div><div class=\"slide-body\">\n<ul>\n<li>Pour mettre l'accent sur l'<strong>objet</strong> du verbe au lieu du sujet :<br><span class=\"frex\">John Baird a inventé la télévision. → La télévision <strong>a été inventée</strong> par John Baird.</span></li>\n<li>Pour mettre l'accent sur l'<strong>événement</strong>, sans mentionner le sujet de l'action :<br><span class=\"frex\">Le président Kennedy <strong>a été assassiné</strong>.</span></li>\n<li>Surtout pour les <strong>inventions</strong>, les <strong>lois</strong> et les <strong>événements subis</strong> :</li>\n</ul>\n<div class=\"cols2 frex\"><span>Un vaccin <strong>a été découvert</strong>.</span><span>Un homme <strong>a été agressé</strong>.</span><span>Une loi <strong>a été votée</strong>.</span><span>J'<strong>ai été opéré / trahi / décoré</strong>.</span></div>\n<div class=\"tip\">Dans les autres cas, on préfère la forme avec <strong>« on »</strong> : <span class=\"frex\"><strong>On</strong> m'a envoyé en mission.</span> (= J'ai été envoyé en mission.)</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e\"><div class=\"section-div\"><div class=\"section-div-inner\"><div class=\"section-icon\">②</div><div class=\"section-title\" style=\"color:#22c55e\">Partie 2 — Modes et temps</div><div class=\"section-sub\">Les modes, puis les temps de l'indicatif</div><div class=\"section-chips\"><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Modes</span><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Futur proche</span><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Passé composé</span><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Imparfait</span><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Plus-que-parfait</span><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Futur simple</span><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Futur antérieur</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Modes</div><div class=\"slide-title\">Les six modes du verbe</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🧭 Le mode</span></div><div class=\"slide-body\">\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Modes personnels (le verbe se conjugue)</h3>\n<div class=\"cols2\"><span><span class=\"gend\">indicatif</span></span><span><span class=\"gend\">impératif</span></span><span><span class=\"gend\">conditionnel</span></span><span><span class=\"gend\">subjonctif</span></span></div>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Modes impersonnels</h3>\n<div class=\"cols2\"><span><span class=\"gend\">participe</span></span><span><span class=\"gend\">infinitif</span></span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Modes et temps</div><div class=\"slide-title\">Temps simples et temps composés</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🧱 Simple / composé</span></div><div class=\"slide-body\">\n<div class=\"rulebox\"><strong>Temps simple</strong> : le verbe seul. &nbsp;·&nbsp; <strong>Temps composé</strong> : auxiliaire + participe passé.</div>\n<table class=\"gtab\"><tr><th>Mode</th><th>Temps simples</th><th>Temps composés</th></tr>\n<tr><td><strong>Indicatif</strong></td><td>présent, imparfait, passé simple, futur simple</td><td>passé composé, plus-que-parfait, passé antérieur, futur antérieur</td></tr>\n<tr><td><strong>Impératif</strong></td><td>présent</td><td>—</td></tr>\n<tr><td><strong>Conditionnel</strong></td><td>présent</td><td>passé</td></tr>\n<tr><td><strong>Subjonctif</strong></td><td>présent</td><td>passé</td></tr>\n<tr><td><strong>Infinitif</strong></td><td>présent</td><td>passé</td></tr>\n<tr><td><strong>Participe</strong></td><td>présent</td><td>passé composé</td></tr>\n</table></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Modes et temps</div><div class=\"slide-title\">Les temps à maîtriser (CLB 7)</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🎯 Objectif CLB 7</span></div><div class=\"slide-body\">\n<table class=\"gtab\"><tr><th>Mode</th><th>Temps</th></tr>\n<tr><td><strong>Indicatif</strong></td><td>présent<br>passé composé · imparfait · plus-que-parfait<br>futur simple · futur antérieur</td></tr>\n<tr><td><strong>Conditionnel</strong></td><td>présent · passé</td></tr>\n<tr><td><strong>Subjonctif</strong></td><td>présent</td></tr>\n<tr><td><strong>Participe</strong></td><td>participe présent · participe passé</td></tr>\n</table></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Futur proche</div><div class=\"slide-title\">Le futur proche</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🚀 aller + infinitif</span></div><div class=\"slide-body\">\n<table class=\"gtab conj\"><tr><td rowspan=\"6\" class=\"frex\"><strong>Demain,</strong></td><td>je</td><td><strong>vais</strong></td><td>dîn<strong>er</strong></td><td>au restaurant.</td></tr>\n<tr><td>tu</td><td><strong>vas</strong></td><td>rest<strong>er</strong></td><td>chez toi ?</td></tr>\n<tr><td>il / elle / on</td><td><strong>va</strong></td><td>all<strong>er</strong></td><td>au cinéma.</td></tr>\n<tr><td>nous</td><td><strong>allons</strong></td><td>visit<strong>er</strong></td><td>une expo.</td></tr>\n<tr><td>vous</td><td><strong>allez</strong></td><td>part<strong>ir</strong></td><td>en week-end ?</td></tr>\n<tr><td>ils / elles</td><td><strong>vont</strong></td><td>fin<strong>ir</strong></td><td>leur travail.</td></tr></table>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Utilisation</h3>\n<ul>\n<li>Sans précision de temps → événement <strong>immédiat</strong> : <span class=\"frex\">Vite : le train <strong>va partir</strong> ! · Regarde : il <strong>va pleuvoir</strong> ! · Attention : tu <strong>vas tomber</strong> !</span></li>\n<li>Avec une précision de temps → futur plus ou moins <strong>lointain</strong> : <span class=\"frex\">Je vais partir <strong>en septembre</strong>. Je vais rester <strong>six ou sept ans</strong> en France.</span></li>\n</ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Futur proche</div><div class=\"slide-title\">Futur proche : place du pronom et de l'adverbe</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">📍 Place</span></div><div class=\"slide-body\">\n<div class=\"rulebox frex\">Ce soir, je vais <strong>me</strong> coucher tôt. Je vais <strong>bien</strong> dormir.</div>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">La place du pronom complément</h3>\n<ul>\n<li>Le pronom complément se place <strong>devant l'infinitif</strong> : <span class=\"frex\">Je vais <strong>les</strong> inviter. · Je vais <strong>leur</strong> téléphoner. · Je vais <strong>me</strong> préparer.</span></li>\n<li>Le futur proche de « il y a » est <strong>« il va y avoir »</strong> : <span class=\"frex\"><strong>Il va y avoir</strong> du brouillard demain. · <strong>Il va y avoir</strong> des embouteillages.</span></li>\n</ul>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">La place de l'adverbe</h3>\n<ul><li>Les adverbes de <strong>quantité</strong> et de <strong>qualité</strong> se placent <strong>entre</strong> les deux verbes : <span class=\"frex\">Je vais <strong>beaucoup</strong> travailler. · Je vais <strong>bien</strong> dormir.</span></li></ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Passé composé</div><div class=\"slide-title\">Le passé composé avec « avoir »</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🕘 avoir + p.p.</span></div><div class=\"slide-body\">\n<table class=\"gtab conj\"><tr><td rowspan=\"6\" class=\"frex\"><strong>Hier,</strong></td><td>j'</td><td><strong>ai</strong></td><td><strong>mangé</strong></td><td>au restaurant.</td></tr>\n<tr><td>tu</td><td><strong>as</strong></td><td><strong>mangé</strong></td><td>chez toi.</td></tr>\n<tr><td>il / elle / on</td><td><strong>a</strong></td><td><strong>mangé</strong></td><td>à midi et demi.</td></tr>\n<tr><td>nous</td><td><strong>avons</strong></td><td><strong>mangé</strong></td><td>ensemble.</td></tr>\n<tr><td>vous</td><td><strong>avez</strong></td><td><strong>mangé</strong></td><td>tard.</td></tr>\n<tr><td>ils / elles</td><td><strong>ont</strong></td><td><strong>mangé</strong></td><td>avec des amis.</td></tr></table>\n<ul>\n<li><strong>Verbes en « -er »</strong> : radical de l'infinitif + <strong>« é »</strong> — <span class=\"frex\">mang-er → j'ai mang<strong>é</strong> · regard-er → j'ai regard<strong>é</strong></span></li>\n<li>Le participe passé <strong>ne s'accorde pas</strong> avec le sujet de « avoir » : <span class=\"frex\">Il a mangé un gâteau. Ils ont mangé un gâteau.</span></li>\n<li>La <strong>majorité des verbes</strong> se conjuguent avec « avoir », y compris <strong>être</strong> et <strong>avoir</strong> : <span class=\"frex\">J'<strong>ai été</strong> malade. J'<strong>ai eu</strong> mal à la gorge.</span></li>\n</ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Passé composé</div><div class=\"slide-title\">Les participes passés</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">📋 Participes</span></div><div class=\"slide-body\">\n<div class=\"pp-grid\">\n<div class=\"pp-col\"><div class=\"pp-h\">en « é »</div><div class=\"pp\">manger <b>mangé</b></div><div class=\"pp\">regarder <b>regardé</b></div><div class=\"pp-note\">tous les verbes en « -er »</div>\n<div class=\"pp-h\">en « i »</div><div class=\"pp\">finir <b>fini</b></div><div class=\"pp\">grandir <b>grandi</b></div><div class=\"pp\">choisir <b>choisi</b></div><div class=\"pp\">prendre <b>pris</b></div><div class=\"pp\">apprendre <b>appris</b></div><div class=\"pp\">comprendre <b>compris</b></div><div class=\"pp\">mettre <b>mis</b></div><div class=\"pp\">dire <b>dit</b></div><div class=\"pp\">écrire <b>écrit</b></div><div class=\"pp\">conduire <b>conduit</b></div></div>\n<div class=\"pp-col\"><div class=\"pp-h\">en « u »</div><div class=\"pp\">lire <b>lu</b></div><div class=\"pp\">voir <b>vu</b></div><div class=\"pp\">boire <b>bu</b></div><div class=\"pp\">entendre <b>entendu</b></div><div class=\"pp\">attendre <b>attendu</b></div><div class=\"pp\">répondre <b>répondu</b></div><div class=\"pp\">perdre <b>perdu</b></div><div class=\"pp\">vouloir <b>voulu</b></div><div class=\"pp\">devoir <b>dû</b></div><div class=\"pp\">pouvoir <b>pu</b></div><div class=\"pp\">savoir <b>su</b></div><div class=\"pp\">croire <b>cru</b></div><div class=\"pp\">falloir <b>fallu</b></div></div>\n<div class=\"pp-col\"><div class=\"pp-h\">en « u » (suite)</div><div class=\"pp\">courir <b>couru</b></div><div class=\"pp\">connaître <b>connu</b></div><div class=\"pp\">disparaître <b>disparu</b></div><div class=\"pp\">plaire <b>plu</b></div><div class=\"pp\">pleuvoir <b>plu</b></div><div class=\"pp\">recevoir <b>reçu</b></div><div class=\"pp\">venir <b>venu</b></div><div class=\"pp\">vivre <b>vécu</b></div>\n<div class=\"pp-h\">autres cas</div><div class=\"pp\">faire <b>fait</b></div><div class=\"pp\">être <b>été</b></div><div class=\"pp\">avoir <b>eu</b></div><div class=\"pp\">ouvrir <b>ouvert</b></div><div class=\"pp\">découvrir <b>découvert</b></div><div class=\"pp\">offrir <b>offert</b></div><div class=\"pp\">souffrir <b>souffert</b></div><div class=\"pp\">peindre <b>peint</b></div><div class=\"pp\">craindre <b>craint</b></div></div>\n</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Passé composé</div><div class=\"slide-title\">Le passé composé avec « être »</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🚶 Déplacement</span></div><div class=\"slide-body\">\n<div class=\"rulebox\">Avec « être » : les <strong>verbes de déplacement</strong> (la maison d'« être »).</div>\n<table class=\"gtab conj\"><tr><td rowspan=\"6\" class=\"frex\"><strong>Hier,</strong></td><td>je</td><td><strong>suis</strong></td><td><strong>parti</strong>(e)</td><td>tard.</td></tr>\n<tr><td>tu</td><td><strong>es</strong></td><td><strong>arrivé</strong>(e)</td><td>tôt.</td></tr>\n<tr><td>il / elle / on</td><td><strong>est</strong></td><td><strong>venu</strong>(e)(s)</td><td>à cinq heures.</td></tr>\n<tr><td>nous</td><td><strong>sommes</strong></td><td><strong>monté</strong>(e)<strong>s</strong></td><td>au troisième étage.</td></tr>\n<tr><td>vous</td><td><strong>êtes</strong></td><td><strong>descendu</strong>(e)(s)</td><td>au sous-sol.</td></tr>\n<tr><td>ils / elles</td><td><strong>sont</strong></td><td><strong>allé</strong>(e)<strong>s</strong></td><td>au cinéma.</td></tr></table></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Passé composé</div><div class=\"slide-title\">Les verbes pronominaux</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🪞 se + être</span></div><div class=\"slide-body\">\n<div class=\"rulebox frex\">Elle <strong>s'est levée</strong> tôt. Il <strong>s'est dépêché</strong>.<br>Ils <strong>se sont rencontrés</strong> dans l'ascenseur.</div>\n<p class=\"body-p\">Les verbes <strong>réfléchis</strong> et <strong>réciproques</strong> se construisent avec <strong>« être »</strong> :</p>\n<table class=\"gtab conj\">\n<tr><td>Je</td><td><strong>me</strong></td><td><strong>suis</strong></td><td class=\"frex\">levé(e) tôt.</td></tr>\n<tr><td>Tu</td><td><strong>t'</strong></td><td><strong>es</strong></td><td class=\"frex\">couché(e) tard.</td></tr>\n<tr><td>Il / Elle / On</td><td><strong>s'</strong></td><td><strong>est</strong></td><td class=\"frex\">douché(e)(s).</td></tr>\n<tr><td>Nous</td><td><strong>nous</strong></td><td><strong>sommes</strong></td><td class=\"frex\">promené(e)s.</td></tr>\n<tr><td>Vous</td><td><strong>vous</strong></td><td><strong>êtes</strong></td><td class=\"frex\">assis(e)(s).</td></tr>\n<tr><td>Ils / Elles</td><td><strong>se</strong></td><td><strong>sont</strong></td><td class=\"frex\">embrassé(e)s.</td></tr></table>\n<div class=\"tip\">En général, le <strong>participe passé s'accorde</strong> (comme un adjectif) avec le <strong>sujet</strong> : <span class=\"frex\"><strong>Il</strong> s'est couch<strong>é</strong> tôt. <strong>Elle</strong> s'est couch<strong>ée</strong> tard. <strong>Ils</strong> se sont endorm<strong>is</strong> tout de suite.</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Passé composé · Accord</div><div class=\"slide-title\">L'accord avec « être »</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">✅ Accord</span></div><div class=\"slide-body\">\n<div class=\"rulebox\">Avec <strong>« être »</strong>, le participe passé <strong>s'accorde avec le sujet</strong>.</div>\n<div class=\"cols2 frex\"><span>Il est parti.</span><span>Elle est parti<strong>e</strong>.</span><span>Ils sont parti<strong>s</strong>.</span><span>Elles sont parti<strong>es</strong>.</span><span>Il s'est couché.</span><span>Elle s'est couché<strong>e</strong>.</span><span>Ils se sont rencontré<strong>s</strong>.</span><span>Elles se sont rencontré<strong>es</strong>.</span></div>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">⚠️ Le participe passé ne s'accorde pas :</h3>\n<ul>\n<li>quand le verbe se construit avec <strong>« à »</strong> : <span class=\"frex\">Ils se sont parlé.</span> (parler <strong>à</strong> qn) · <span class=\"frex\">Ils se sont téléphoné.</span> (téléphoner <strong>à</strong> qn)</li>\n<li>quand le verbe est suivi d'un <strong>complément d'objet direct</strong> :<br><span class=\"frex\">Elle s'est lavée. → Elle s'est lavé <u>les mains</u>. · Elle s'est coupée. → Elle s'est coupé <u>le doigt</u>.</span></li>\n</ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Passé composé · Accord</div><div class=\"slide-title\">L'accord avec « avoir »</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">✅ Accord</span></div><div class=\"slide-body\">\n<div class=\"rulebox\">Avec <strong>« avoir »</strong>, le participe passé <strong>ne s'accorde pas</strong> avec le sujet : <span class=\"frex\">Il a mangé. Elle a mangé. Ils ont mangé.</span></div>\n<div class=\"tip\">⚠️ Le participe <strong>s'accorde</strong> avec le complément d'<strong>objet direct</strong> s'il est placé <strong>avant</strong>, c'est-à-dire quand on connaît son genre et son nombre.</div>\n<table class=\"gtab\"><tr><th>Je n'accorde pas</th><th>J'accorde</th></tr>\n<tr><td class=\"frex\">J'ai acheté des fleurs.</td><td class=\"frex\">Regarde <u>les fleurs</u> que j'ai achet<strong>ées</strong>.</td></tr>\n<tr><td class=\"frex\">J'ai invité les voisins.</td><td class=\"frex\">Je <strong>les</strong> ai invité<strong>s</strong> hier.</td></tr></table>\n<div class=\"tip\">🎵 On <strong>entend</strong> l'accord féminin des participes en « -t » et « -s » : <span class=\"frex\">J'ai ouvert la porte. Je l'ai ouver<strong>te</strong>. · La robe que j'ai mi<strong>se</strong> est froissée.</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Imparfait</div><div class=\"slide-title\">L'imparfait</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🕰 Habitudes passées</span></div><div class=\"slide-body\">\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Utilisation</h3>\n<ul><li>L'imparfait exprime des <strong>habitudes passées</strong> :<br><span class=\"frex\">Maintenant, j'habite à Paris, je travaille chez IBM.<br>Avant, j'habit<strong>ais</strong> à Marseille, je travaill<strong>ais</strong> chez BMI.</span></li>\n<li>Après certaines expressions : <span class=\"frex\"><strong>À cette époque-là</strong>, / <strong>Avant, quand</strong> j'étais jeune, j'avais les cheveux longs.</span></li></ul>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Formation</h3>\n<div class=\"rulebox\">Radical de <strong>« nous »</strong> au présent + <strong>-ais, -ais, -ait, -ions, -iez, -aient</strong></div>\n<div class=\"cols2 frex\"><span>nous <strong>parl</strong>-ons → je parl<strong>ais</strong></span><span>nous <strong>mange</strong>-ons → je mange<strong>ais</strong> (g + e + a)</span><span>nous <strong>pren</strong>-ons → je pren<strong>ais</strong></span><span>nous <strong>commenç</strong>-ons → je commenç<strong>ais</strong> (ç + a)</span><span>nous <strong>finiss</strong>-ons → je finiss<strong>ais</strong></span><span>⚠️ être : j'<strong>étais</strong>, tu <strong>étais</strong>…</span></div>\n<div class=\"tip\">🎵 Une seule finale <strong>« ai »</strong> à l'oral, sauf pour « nous » et « vous ».</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Imparfait / passé composé</div><div class=\"slide-title\">Imparfait ou passé composé ?</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🎞 Photo / film</span></div><div class=\"slide-body\">\n<div class=\"rulebox frex\">Avant, j'<strong>habitais</strong> à Marseille ; en 1995, j'<strong>ai déménagé</strong>.<br>Quand j'<strong>ai déménagé</strong>, j'<strong>avais</strong> seize ans. C'<strong>était</strong> l'hiver.</div>\n<ul>\n<li>Pour évoquer des <strong>souvenirs</strong> → imparfait : <span class=\"frex\">Quand j'<strong>étais</strong> jeune, je <strong>jouais</strong> du piano.</span></li>\n<li>Pour raconter un <strong>événement</strong> → passé composé : <span class=\"frex\">Un jour, j'<strong>ai joué</strong> devant la reine d'Angleterre.</span></li>\n</ul>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Le récit au passé utilise les deux formes</h3>\n<p class=\"body-p\">Passé composé = les <strong>événements</strong> · imparfait = les <strong>descriptions</strong> et les <strong>situations</strong>.</p>\n<div class=\"rulebox frex\">Le jour où j'<strong>ai joué</strong> devant la reine, j'<strong>avais</strong> douze ans. C'<strong>était</strong> la fête de l'école. Il <strong>faisait</strong> chaud.</div>\n<div class=\"tip\">L'imparfait donne le <strong>décor</strong> (comme une photo) ; le passé composé, la <strong>succession des événements</strong> (comme un film) :<br><span class=\"frex\">Pendant que je <strong>jouais</strong>, tout le monde <strong>bavardait</strong>. Soudain, la reine <strong>est arrivée</strong>. Elle <strong>a applaudi</strong>. Tout le monde <strong>s'est levé</strong>.</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Imparfait / passé composé</div><div class=\"slide-title\">Imparfait ou passé composé ? (suite)</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">⏳ Durée</span></div><div class=\"slide-body\">\n<div class=\"tip\">⚠️ <strong>Tout à coup, soudain, brusquement</strong> → passé composé · <strong>pendant que</strong> → imparfait<br><span class=\"frex\"><strong>Tout à coup</strong>, la reine est arrivée. Elle est entrée <strong>pendant que</strong> je jouais.</span></div>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Durée définie / durée indéfinie</h3>\n<table class=\"gtab\"><tr><th>Durée définie → passé composé</th><th>Durée indéfinie → imparfait</th></tr>\n<tr><td class=\"frex\"><strong>De</strong> 1980 <strong>à</strong> 1990, / <strong>Pendant</strong> dix ans, / <strong>Entre</strong> dix et vingt ans,<br>→ j'<strong>ai fait</strong> du piano.</td><td class=\"frex\"><strong>Avant</strong>, / <strong>Quand</strong> j'étais jeune, / <strong>À cette époque-là</strong>,<br>→ je <strong>faisais</strong> du piano.</td></tr></table>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Un changement</h3>\n<p class=\"body-p\">Le passé composé indique un <strong>changement</strong> par rapport à d'anciennes habitudes ou à une situation donnée :</p>\n<table class=\"gtab\"><tr><th>Imparfait (situation)</th><th>Passé composé (changement)</th></tr>\n<tr><td class=\"frex\">Avant, j'<strong>habitais</strong> à Lyon.</td><td class=\"frex\">Un jour, <strong>j'ai déménagé</strong>.</td></tr>\n<tr><td class=\"frex\">Hier, il <strong>faisait</strong> beau.</td><td class=\"frex\">Tout à coup, le temps <strong>a changé</strong>.</td></tr></table></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Plus-que-parfait</div><div class=\"slide-title\">Le plus-que-parfait</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">⏮ Avant le passé</span></div><div class=\"slide-body\">\n<div class=\"rulebox\">Le plus-que-parfait indique qu'un événement <strong>précède un autre événement dans le passé</strong>.</div>\n<div class=\"rulebox frex\">La maison a brûlé. Les pompiers sont arrivés.<br>→ Quand les pompiers <strong>sont arrivés</strong>, la maison <strong>avait</strong> déjà <strong>brûlé</strong>.<br><br>Le train est parti. Nous sommes arrivés à la gare.<br>→ Quand nous <strong>sommes arrivés</strong> à la gare, le train <strong>était</strong> déjà <strong>parti</strong>.</div>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Formation</h3>\n<div class=\"rulebox\"><strong>« être »</strong> ou <strong>« avoir »</strong> à l'<strong>imparfait</strong> + participe passé</div>\n<div class=\"cols2 frex\"><span>J'<strong>avais dîné</strong>.</span><span>Il <strong>était parti</strong>.</span><span>Nous <strong>avions fini</strong>.</span><span>Je m'<strong>étais couché</strong>.</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Futur simple</div><div class=\"slide-title\">Le futur simple</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🔮 Projets</span></div><div class=\"slide-body\">\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Utilisation</h3>\n<ul><li>Pour des <strong>projets</strong> d'avenir ou des <strong>prévisions</strong> : <span class=\"frex\">Dans cinq ans, je <strong>prendrai</strong> ma retraite. Quand je <strong>serai</strong> vieux, je <strong>vivrai</strong> à la campagne. Demain, il <strong>pleuvra</strong> sur toute la France.</span></li></ul>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Formation</h3>\n<div class=\"rulebox\"><strong>Infinitif</strong> + <strong>-ai, -as, -a, -ons, -ez, -ont</strong> &nbsp;<span class=\"frex\">je parler<strong>ai</strong>, tu parler<strong>as</strong>, il parler<strong>a</strong>, nous parler<strong>ons</strong>, vous parler<strong>ez</strong>, ils parler<strong>ont</strong></span><br>🎵 Le son <strong>« r »</strong> est caractéristique du futur simple.</div>\n<div class=\"tip\">⚠️ Infinitif en <strong>« -e »</strong> → on supprime le « e » : <span class=\"frex\">boire → je <strong>boir</strong>ai · dire → je <strong>dir</strong>ai · mettre → je <strong>mettr</strong>ai</span></div>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Verbes irréguliers</h3>\n<div class=\"irr-grid frex\"><span>être → je <strong>serai</strong></span><span>faire → je <strong>ferai</strong></span><span>devoir → je <strong>devrai</strong></span><span>avoir → j'<strong>aurai</strong></span><span>aller → j'<strong>irai</strong></span><span>venir → je <strong>viendrai</strong></span><span>voir → je <strong>verrai</strong></span><span>envoyer → j'<strong>enverrai</strong></span><span>recevoir → je <strong>recevrai</strong></span><span>pouvoir → je <strong>pourrai</strong></span><span>savoir → je <strong>saurai</strong></span><span>courir → je <strong>courrai</strong></span><span>il y a → il y <strong>aura</strong></span><span>il faut → il <strong>faudra</strong></span><span>il pleut → il <strong>pleuvra</strong></span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Futur proche / futur simple</div><div class=\"slide-title\">Futur proche ou futur simple ?</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🔀 Changement / programme</span></div><div class=\"slide-body\">\n<div class=\"rulebox frex\">– Je <strong>vais partir</strong> et je vous <strong>enverrai</strong> mon adresse.<br>– Quand vous <strong>viendrez</strong> me voir, on <strong>ira</strong> pêcher la truite !</div>\n<ul>\n<li>Le futur proche indique en général un <strong>changement</strong> à venir : <span class=\"frex\">Je <strong>vais avoir</strong> un bébé.</span></li>\n<li>Le futur simple indique en général une <strong>programmation</strong> : <span class=\"frex\">J'<strong>aurai</strong> des enfants.</span></li>\n<li>Futur proche pour les <strong>changements</strong>, futur simple pour leurs <strong>conséquences</strong> :<br><span class=\"frex\">On <strong>va recevoir</strong> de nouveaux ordinateurs. On <strong>pourra</strong> traiter plus de dossiers. On <strong>gagnera</strong> du temps, on <strong>sera</strong> plus compétitifs.</span></li>\n</ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Futur antérieur</div><div class=\"slide-title\">Le futur antérieur</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">⏭ Avant le futur</span></div><div class=\"slide-body\">\n<div class=\"rulebox\">Le futur antérieur indique qu'un événement <strong>précède un autre événement dans l'avenir</strong>.</div>\n<div class=\"rulebox frex\">Je vais dîner et je vais sortir.<br>→ Quand j'<strong>aurai dîné</strong>, je sortirai.</div>\n<h3 class=\"sec-h3\" style=\"color:#22c55e\">Formation</h3>\n<div class=\"rulebox\"><strong>« être »</strong> ou <strong>« avoir »</strong> au <strong>futur simple</strong> + participe passé</div>\n<div class=\"cols2 frex\"><span>J'<strong>aurai dîné</strong></span><span>Il <strong>sera parti</strong></span><span>Nous <strong>aurons fini</strong></span><span>Je me <strong>serai couché</strong></span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Résumé</div><div class=\"slide-title\">Les temps de l'indicatif : résumé</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🗺 Résumé</span></div><div class=\"slide-body\">\n<div class=\"tl\">\n<div class=\"tl-row tl-top\"><div class=\"tl-c\"><div class=\"tl-n\">Imparfait</div><span class=\"frex\">J'<strong>habitais</strong> à Rome.</span></div><div class=\"tl-c\"><div class=\"tl-n\">Présent</div><span class=\"frex\">J'<strong>habite</strong> à Paris.</span></div><div class=\"tl-c\"><div class=\"tl-n\">Futur simple</div><span class=\"frex\">J'<strong>habiterai</strong> à Tokyo.</span></div></div>\n<div class=\"tl-axis\"><span>passé</span><span>maintenant</span><span>futur</span></div>\n<div class=\"tl-row tl-bot\"><div class=\"tl-c\"><div class=\"tl-n\">Plus-que-parfait</div><span class=\"frex\">J'<strong>avais fini</strong> mes études (quand j'ai déménagé).</span></div><div class=\"tl-c\"><div class=\"tl-n\">Passé composé</div><span class=\"frex\">J'<strong>ai déménagé</strong> il y a six mois.</span></div><div class=\"tl-c\"><div class=\"tl-n\">Futur proche</div><span class=\"frex\">Je <strong>vais déménager</strong> dans six mois.</span></div><div class=\"tl-c\"><div class=\"tl-n\">Futur antérieur</div><span class=\"frex\">Tu me rejoindras quand j'<strong>aurai déménagé</strong>.</span></div></div>\n</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818\"><div class=\"section-div\"><div class=\"section-div-inner\"><div class=\"section-icon\">③</div><div class=\"section-title\" style=\"color:#EE5818\">Partie 3 — Le conditionnel et l'hypothèse</div><div class=\"section-sub\">Politesse, conseil, désir, imaginaire — et les phrases avec « si »</div><div class=\"section-chips\"><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Politesse</span><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Conseil</span><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Désir</span><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Imaginaire</span><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Si + présent</span><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Si + imparfait</span><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Si + plus-que-parfait</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Conditionnel</div><div class=\"slide-title\">Politesse, conseil, désir</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">💬 Emplois</span></div><div class=\"slide-body\">\n<div class=\"qcat-grid\">\n<div class=\"q-item\"><div class=\"q-bullet\">🙏</div><div class=\"q-text\">Demander <strong>poliment</strong> (vouloir, pouvoir) :<br><span class=\"frex\">Je <strong>voudrais</strong> un renseignement. · Est-ce que je <strong>pourrais</strong> parler à monsieur Bruni ?</span></div></div>\n<div class=\"q-item\"><div class=\"q-bullet\">💡</div><div class=\"q-text\">Faire une suggestion, donner un <strong>conseil</strong> (devoir) :<br><span class=\"frex\">Vous <strong>devriez</strong> moderniser votre entreprise. · Tu <strong>devrais</strong> te faire couper les cheveux.</span></div></div>\n<div class=\"q-item\"><div class=\"q-bullet\">✨</div><div class=\"q-text\">Exprimer un <strong>désir</strong> (aimer, vouloir) :<br><span class=\"frex\">J'<strong>aimerais</strong> savoir dessiner. · Je <strong>voudrais</strong> être en vacances.</span></div></div>\n</div>\n<div class=\"tip\">« <strong>Bien</strong> » (= volontiers) accompagne souvent le désir : <span class=\"frex\">Je boirais <strong>bien</strong> un café. · J'irais <strong>bien</strong> au cinéma.</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Conditionnel</div><div class=\"slide-title\">Formes courantes</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">📋 Formes</span></div><div class=\"slide-body\">\n<table class=\"gtab\"><tr><th>Verbe</th><th>je</th><th>vous</th></tr>\n<tr><td>vouloir</td><td class=\"frex\">je voud<strong>rais</strong></td><td class=\"frex\">vous voud<strong>riez</strong></td></tr>\n<tr><td>aimer</td><td class=\"frex\">j'aime<strong>rais</strong></td><td class=\"frex\">vous aime<strong>riez</strong></td></tr>\n<tr><td>devoir</td><td class=\"frex\">je dev<strong>rais</strong></td><td class=\"frex\">vous dev<strong>riez</strong></td></tr>\n<tr><td>pouvoir</td><td class=\"frex\">je pour<strong>rais</strong></td><td class=\"frex\">vous pour<strong>riez</strong></td></tr>\n<tr><td>faire</td><td class=\"frex\">je fe<strong>rais</strong></td><td class=\"frex\">vous fe<strong>riez</strong></td></tr>\n<tr><td>aller</td><td class=\"frex\">j'i<strong>rais</strong></td><td class=\"frex\">vous i<strong>riez</strong></td></tr></table>\n<div class=\"rulebox\">Terminaisons : <strong>-rais, -rais, -rait, -rions, -riez, -raient</strong></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Conditionnel</div><div class=\"slide-title\">L'expression de l'imaginaire</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">🌈 Imaginaire</span></div><div class=\"slide-body\">\n<ul>\n<li><strong>Imaginer</strong> une autre réalité : <span class=\"frex\">Sans toi, je <strong>serais</strong> perdu. Je <strong>ferais</strong> n'importe quoi. Sans mon psy, j'<strong>aurais raté</strong> ma vie.</span><br>Surtout dans l'hypothèse avec « si » : <span class=\"frex\">Si tu n'étais pas là, je <strong>serais</strong> perdu.</span></li>\n<li>Avec <strong>« au cas où »</strong>, pour faire une <strong>supposition</strong> : <span class=\"frex\"><strong>Au cas où</strong> vous <strong>auriez</strong> des problèmes, téléphonez-moi. · <strong>Au cas où</strong> vous <strong>auriez</strong> trouvé des clés, laissez-les au concierge.</span></li>\n<li>Pour donner une information <strong>non confirmée</strong> : <span class=\"frex\">Le président <strong>devrait</strong> se rendre à Tokyo. · L'accident d'avion <strong>aurait fait</strong> deux cents victimes.</span></li>\n<li>Pour exprimer des <strong>regrets</strong> : <span class=\"frex\">J'<strong>aurais aimé</strong> faire du piano. J'<strong>aurais dû</strong> travailler plus.</span></li>\n</ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Conditionnel</div><div class=\"slide-title\">La formation du conditionnel</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">🧱 Formation</span></div><div class=\"slide-body\">\n<table class=\"gtab\"><tr><th>Conditionnel présent</th><th>Conditionnel passé</th></tr>\n<tr><td>radical du <strong>futur</strong> + terminaisons de l'<strong>imparfait</strong></td><td>conditionnel de <strong>« être »</strong> ou <strong>« avoir »</strong> + participe passé</td></tr>\n<tr><td class=\"frex\">Je <strong>voudr</strong>-ais · Je <strong>devr</strong>-ais</td><td class=\"frex\">J'<strong>aurais voulu</strong> · J'<strong>aurais dû</strong></td></tr></table></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Hypothèse</div><div class=\"slide-title\">L'hypothèse sur le futur</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">🔮 si + présent</span></div><div class=\"slide-body\">\n<h3 class=\"sec-h3\" style=\"color:#EE5818\">« Quand » et « si »</h3>\n<ul><li><strong>« Quand »</strong> + futur simple → <strong>certitude</strong> : <span class=\"frex\">L'année prochaine, quand <strong>je reviendrai</strong>, <strong>j'irai</strong> au Ritz. · Demain, quand <strong>je sortirai</strong>, <strong>je passerai</strong> chez toi.</span></li>\n<li>Pas de certitude → <strong>hypothèse sur le futur</strong> :</li></ul>\n<div class=\"formula\"><span>« si »</span><b>+</b><span>présent</span><span>futur simple</span></div>\n<div class=\"rulebox frex\">L'année prochaine, si <strong>je reviens</strong> à Paris, <strong>j'irai</strong> au Ritz.<br>Demain, si <strong>je sors</strong> tôt, <strong>je passerai</strong> chez toi.</div>\n<div class=\"tip\">⚠️ <strong>Jamais</strong> de futur après « si » : <span class=\"frex\"><strong>S'il fait</strong> beau et <strong>si j'ai</strong> des vacances, j'irai à la plage.</span><br>Ne pas confondre avec le « si » du <strong>discours indirect</strong> (oui ou non), qui peut être suivi du futur : <span class=\"frex\">Je ne sais pas si je partirai. · Il lui demande si elle viendra.</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Hypothèse</div><div class=\"slide-title\">Généralité et recommandation</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">📌 si + présent</span></div><div class=\"slide-body\">\n<h3 class=\"sec-h3\" style=\"color:#EE5818\">Une généralité : « si » + présent / présent</h3>\n<div class=\"rulebox frex\">Si on mange trop, on grossit.<br>Si je dors trop, j'ai mal à la tête. <span style=\"font-style:normal\">(« si » = « quand »)</span></div>\n<h3 class=\"sec-h3\" style=\"color:#EE5818\">Une recommandation : « si » + présent / impératif</h3>\n<div class=\"rulebox frex\">Si tu sors, mets ton manteau !<br>Si tu as des problèmes, appelle-moi !</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Hypothèse</div><div class=\"slide-title\">L'hypothèse sur le présent</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">💭 si + imparfait</span></div><div class=\"slide-body\">\n<div class=\"rulebox frex\">Aujourd'hui, <strong>s'il faisait</strong> beau, j'<strong>irais</strong> à la piscine.</div>\n<p class=\"body-p\">On imagine quelque chose qui <strong>n'existe pas</strong> :</p>\n<div class=\"formula\"><span>« si »</span><b>+</b><span>imparfait</span><span>conditionnel présent</span></div>\n<div class=\"cols2 frex\"><span>Aujourd'hui, il ne fait pas beau. Je ne sors pas.</span><span>→ Aujourd'hui, <strong>s'il faisait</strong> beau, <strong>je sortirais</strong>.</span><span>Je ne suis pas français. Je parle mal français.</span><span>→ <strong>Si j'étais</strong> français, <strong>je parlerais</strong> bien français.</span></div>\n<div class=\"tip\">Pour faire une <strong>suggestion</strong> : « si » + imparfait — <span class=\"frex\"><strong>Si on allait</strong> au cinéma ?</span> (= Je propose d'aller au cinéma.) · <span class=\"frex\"><strong>Si on prenait</strong> un café ?</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Hypothèse</div><div class=\"slide-title\">L'hypothèse sur le passé</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">⏪ si + plus-que-parfait</span></div><div class=\"slide-body\">\n<div class=\"rulebox frex\">Hier, <strong>s'il avait fait</strong> beau, je <strong>serais allé</strong> à la piscine.</div>\n<p class=\"body-p\">On imagine quelque chose qui <strong>n'a pas eu lieu</strong> :</p>\n<div class=\"formula\"><span>« si »</span><b>+</b><span>plus-que-parfait</span><span>conditionnel passé</span></div>\n<div class=\"cols2 frex\"><span>Dimanche dernier, il n'a pas fait beau. Je ne suis pas sorti.</span><span>→ Dimanche dernier, <strong>s'il avait fait</strong> beau, <strong>je serais sorti</strong>.</span><span>Hier, je suis parti en retard et j'ai raté le train.</span><span>→ Hier, <strong>si je n'étais pas parti</strong> en retard, <strong>je n'aurais pas raté</strong> le train.</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Hypothèse</div><div class=\"slide-title\">Les phrases avec « si » : résumé</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">🗂 Résumé</span></div><div class=\"slide-body\">\n<table class=\"gtab\"><tr><th>Sens</th><th>« si » +</th><th>Principale</th></tr>\n<tr><td>Généralité</td><td>présent</td><td>présent</td></tr>\n<tr><td>Recommandation</td><td>présent</td><td>impératif</td></tr>\n<tr><td>Hypothèse sur le futur</td><td>présent</td><td>futur simple</td></tr>\n<tr><td>Hypothèse sur le présent</td><td>imparfait</td><td>conditionnel présent</td></tr>\n<tr><td>Hypothèse sur le passé</td><td>plus-que-parfait</td><td>conditionnel passé</td></tr></table>\n<div class=\"tip\">⚠️ Jamais de futur ni de conditionnel après le « si » de l'hypothèse.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0\"><div class=\"section-div\"><div class=\"section-div-inner\"><div class=\"section-icon\">④</div><div class=\"section-title\" style=\"color:#8B6FC0\">Partie 4 — Négation, discours indirect, prépositions</div><div class=\"section-sub\">Les formes de la négation, rapporter des paroles, verbe + à / de</div><div class=\"section-chips\"><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">ne… jamais / plus</span><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">ne… rien / personne</span><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">ni… ni · sans</span><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">ne… que</span><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">Discours indirect</span><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">à / de + infinitif</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Négation</div><div class=\"slide-title\">ne… jamais · ne… plus · ne… aucun</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🚫 Négation</span></div><div class=\"slide-body\">\n<table class=\"gtab\"><tr><th>« ne… jamais » ≠ toujours</th><th>« ne… plus » ≠ encore</th></tr>\n<tr><td class=\"frex\">Je bois <strong>toujours</strong> du thé le matin.<br>Je <strong>ne</strong> bois <strong>jamais</strong> de café.<br><span style=\"font-style:normal\">(= habitude)</span></td><td class=\"frex\">Max fume <strong>encore</strong>.<br>Moi, je <strong>ne</strong> fume <strong>plus</strong>.<br><span style=\"font-style:normal\">(= changement)</span></td></tr></table>\n<ul>\n<li>Quand « toujours » signifie « encore » → <strong>ne… plus</strong> : <span class=\"frex\">– Tu fumes toujours ? – Non, je <strong>ne</strong> fume <strong>plus</strong>.</span></li>\n<li>La négation de « déjà » : <strong>jamais</strong> (constat) ou <strong>pas encore</strong> (intention) : <span class=\"frex\">– Vous êtes déjà allé à Paris ? – Non, je <strong>ne</strong> suis <strong>jamais</strong> allé à Paris. / – Non, je <strong>ne</strong> suis <strong>pas encore</strong> allé à Paris.</span></li>\n<li>🎵 Le « s » de « plus » négatif n'est <strong>jamais prononcé</strong> : <span class=\"frex\">Je ne bois plu<s>s</s>. Je ne fume plu<s>s</s>.</span></li>\n</ul>\n<h3 class=\"sec-h3\" style=\"color:#8B6FC0\">« ne… aucun » = pas un seul</h3>\n<div class=\"cols2 frex\"><span>Je <strong>ne</strong> connais <strong>aucun</strong> Français.</span><span>= pas un seul Français</span><span>Je <strong>n'</strong>ai <strong>aucun</strong> ami en France.</span><span>= pas un seul ami</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Négation</div><div class=\"slide-title\">ne… rien · ne… personne</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🚫 Négation</span></div><div class=\"slide-body\">\n<table class=\"gtab\"><tr><th>« ne… rien » ≠ quelque chose</th><th>« ne… personne » ≠ quelqu'un</th></tr>\n<tr><td class=\"frex\">Tu vois <strong>quelque chose</strong> ?<br>Je <strong>ne</strong> vois <strong>rien</strong>.</td><td class=\"frex\">Tu attends <strong>quelqu'un</strong> ?<br>Je <strong>n'</strong>attends <strong>personne</strong>.</td></tr></table>\n<ul><li>En position <strong>sujet</strong> : <span class=\"frex\"><strong>Rien ne</strong> bouge. <strong>Personne ne</strong> parle.</span></li></ul>\n<table class=\"gtab\"><tr><th>⚠️ Dites</th><th>Ne dites pas</th></tr>\n<tr><td class=\"frex\">Je <strong>ne</strong> connais <strong>personne</strong>.</td><td class=\"frex\">Je ne connais <s>pas</s> personne.</td></tr>\n<tr><td class=\"frex\"><strong>Rien ne</strong> marche.</td><td class=\"frex\">Rien ne marche <s>pas</s>.</td></tr></table>\n<div class=\"tip\">Plusieurs négations peuvent se suivre dans une même phrase : <span class=\"frex\">Tu <strong>ne</strong> comprends <strong>jamais rien</strong>. · Il <strong>n'</strong>y a <strong>plus personne</strong>.</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Négation</div><div class=\"slide-title\">ni… ni · sans</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🚫 Négation</span></div><div class=\"slide-body\">\n<div class=\"rulebox frex\">Je <strong>ne</strong> travaille <strong>ni</strong> le lundi <strong>ni</strong> le mardi.</div>\n<h3 class=\"sec-h3\" style=\"color:#8B6FC0\">« ni… ni » : négation de deux éléments (ou plus) reliés par « et »</h3>\n<div class=\"rulebox frex\">Paul est jeune, beau et intelligent. → Paul <strong>n'</strong>est <strong>ni</strong> jeune, <strong>ni</strong> beau, <strong>ni</strong> intelligent.</div>\n<ul><li>L'article indéfini ou partitif <strong>disparaît</strong> après « ni » : <span class=\"frex\">– Tu as un stylo et un cahier ? – Je n'ai <strong>ni</strong> stylo <strong>ni</strong> cahier. · – Tu veux du thé ou du café ? – Je ne veux <strong>ni</strong> thé <strong>ni</strong> café.</span></li></ul>\n<h3 class=\"sec-h3\" style=\"color:#8B6FC0\">« sans » : négation de « avec »</h3>\n<ul><li>L'article indéfini ou partitif <strong>disparaît</strong> après « sans » : <span class=\"frex\">Il sort avec un imperméable. → Il sort <strong>sans</strong> imperméable. · Il mange de la salade avec de l'huile. → … <strong>sans</strong> huile.</span></li>\n<li>On utilise « <strong>sans… ni</strong> » plutôt que « sans… sans » : <span class=\"frex\">Il sort <strong>sans</strong> imperméable <strong>ni</strong> parapluie. · Il mange de la salade <strong>sans</strong> huile <strong>ni</strong> vinaigre.</span></li></ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Restriction</div><div class=\"slide-title\">ne… que</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">☝️ = seulement</span></div><div class=\"slide-body\">\n<div class=\"rulebox\">« <strong>ne… que</strong> » n'est pas une négation, mais une <strong>restriction</strong> (= seulement).</div>\n<div class=\"cols2 frex\"><span>Julien <strong>n'</strong>a <strong>que</strong> cinq ans.</span><span>= Il a seulement cinq ans.</span><span>Je <strong>ne</strong> dors <strong>que</strong> six heures.</span><span>= Je dors seulement six heures.</span><span>Je <strong>ne</strong> travaille <strong>que</strong> trois jours par semaine.</span><span></span></div>\n<ul><li>« Ne » se place <strong>devant le verbe</strong> ; « que » se place <strong>devant l'élément</strong> sur lequel porte la restriction :<br><span class=\"frex\">Ça <strong>ne</strong> coûte <strong>que</strong> dix euros. · Ça <strong>ne</strong> coûte, en ce moment, <strong>que</strong> dix euros. · Ça <strong>ne</strong> coûte, jusqu'à la fin du mois, <strong>que</strong> dix euros.</span></li>\n<li>Sur les affiches de publicité, on utilise souvent « que » tout seul : <span class=\"frex\">– <strong>Que</strong> 10 € !</span> (= seulement 10 €) · <span class=\"frex\">– <strong>Que</strong> des affaires !</span> (= seulement de bonnes affaires)</li></ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Discours indirect</div><div class=\"slide-title\">Le discours indirect</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🗣 Rapporter</span></div><div class=\"slide-body\">\n<div class=\"rulebox\">Le discours indirect permet de <strong>rapporter des paroles ou des pensées</strong>.</div>\n<table class=\"gtab\"><tr><th></th><th>Discours direct</th><th>Discours indirect</th></tr>\n<tr><td><strong>Affirmation</strong><br>→ + « que »</td><td class=\"frex\">Paul dit : « Il pleut. »<br>Il pense : « C'est dommage. »</td><td class=\"frex\">Paul dit <strong>qu'</strong>il pleut.<br>Il pense <strong>que</strong> c'est dommage.</td></tr>\n<tr><td><strong>Question oui / non</strong><br>→ + « si »</td><td class=\"frex\">– Est-ce que vous sortez ?<br>– Il fait froid ?</td><td class=\"frex\">Il demande <strong>si</strong> vous sortez.<br>Il demande <strong>s'</strong>il fait froid.</td></tr>\n<tr><td><strong>Interrogatif</strong><br>→ sans inversion</td><td class=\"frex\">– Où allez-vous ?<br>– Quand partez-vous ?</td><td class=\"frex\">Il demande <strong>où</strong> vous allez.<br>Il demande <strong>quand</strong> vous partez.</td></tr>\n<tr><td><strong>Qu'est-ce que / qui, Que</strong><br>→ « ce que » / « ce qui »</td><td class=\"frex\">– Qu'est-ce que vous faites ?<br>– Qu'est-ce qui se passe ?<br>– Que voulez-vous ?</td><td class=\"frex\">Il demande <strong>ce que</strong> vous faites.<br>Il demande <strong>ce qui</strong> se passe.<br>Il demande <strong>ce que</strong> vous voulez.</td></tr>\n<tr><td><strong>Impératif</strong><br>→ « de » + infinitif</td><td class=\"frex\">– Partez !</td><td class=\"frex\">Il lui dit <strong>de</strong> partir.</td></tr></table>\n<div class=\"tip\">⚠️ Dites : <span class=\"frex\">Je sais <strong>ce qu'</strong>il veut.</span> — Ne dites pas : <span class=\"frex\">Je sais <s>qu'est-ce</s> qu'il veut.</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Discours indirect</div><div class=\"slide-title\">Le discours indirect au passé</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🔁 Concordance</span></div><div class=\"slide-body\">\n<div class=\"rulebox frex\">Il m'a dit qu'il <strong>était</strong> écrivain et qu'il <strong>avait écrit</strong> plusieurs romans.<br>Il m'a dit qu'il me <strong>donnerait</strong> ses livres.</div>\n<ul><li>On l'utilise surtout pour rapporter un dialogue (ou des pensées) <strong>au passé</strong> : <span class=\"frex\">Il m'<strong>a dit</strong> qu'il <strong>était</strong> allemand. · Je <strong>croyais</strong> qu'il <strong>était</strong> anglais.</span></li>\n<li>Après un verbe introducteur <strong>au passé</strong>, le reste de la phrase se met au passé : c'est la <strong>concordance</strong>.</li></ul>\n<table class=\"gtab\"><tr><th>Il dit qu'…</th><th>Il a dit qu'…</th><th>Transformation</th></tr>\n<tr><td class=\"frex\">il pleut.</td><td class=\"frex\">il pleuv<strong>ait</strong>.</td><td>présent → imparfait</td></tr>\n<tr><td class=\"frex\">il a plu.</td><td class=\"frex\">il av<strong>ait</strong> plu.</td><td>passé composé → plus-que-parfait</td></tr>\n<tr><td class=\"frex\">il va pleuvoir.</td><td class=\"frex\">il all<strong>ait</strong> pleuvoir.</td><td>futur proche → « aller » à l'imparfait + inf.</td></tr>\n<tr><td class=\"frex\">il pleuvra.</td><td class=\"frex\">il pleuv<strong>rait</strong>.</td><td>futur simple → conditionnel</td></tr></table>\n<div class=\"tip\">🎵 Le passé « s'entend » dans les finales à l'imparfait.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Discours indirect</div><div class=\"slide-title\">L'imparfait de concordance</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🔁 Concordance</span></div><div class=\"slide-body\">\n<div class=\"rulebox\">L'imparfait de concordance a une <strong>valeur phonétique</strong> : ce n'est pas un vrai passé.</div>\n<div class=\"cols2 frex\"><span>Il m'a dit qu'il <strong>était</strong> allemand.</span><span>= Il est allemand.</span><span>Il m'a dit qu'il <strong>viendrait</strong> en mars.</span><span>= Il viendra en mars.</span></div>\n<ul><li>Dans la principale, « dire » est souvent au <strong>passé composé</strong>, « croire » et « penser » à l'<strong>imparfait</strong> :<br><span class=\"frex\">On m'<strong>a dit</strong> que…</span> (un jour) · <span class=\"frex\">Je <strong>croyais</strong> / Je <strong>pensais</strong> que…</span> (situation mentale)</li>\n<li>Parfois, la concordance <strong>n'est pas appliquée</strong> quand on annonce un résultat ou qu'on constate un fait nouveau :<br><span class=\"frex\">On a constaté que le mont Blanc <strong>fait</strong> 4 810 m (et pas 4 807 m).</span></li></ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Verbe + infinitif</div><div class=\"slide-title\">Les prépositions « à » et « de »</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🔗 à / de + infinitif</span></div><div class=\"slide-body\">\n<div class=\"rulebox\">Les prépositions « à » et « de » devant un infinitif sont <strong>arbitraires</strong> : il faut les apprendre.</div>\n<table class=\"gtab\"><tr><th>Verbe + « de » + verbe</th><th>Verbe + « à » + verbe</th></tr>\n<tr><td class=\"frex\">accepter <strong>de</strong> · arrêter <strong>de</strong> · décider <strong>de</strong> · essayer <strong>de</strong> · finir <strong>de</strong> · oublier <strong>de</strong> · refuser <strong>de</strong> · regretter <strong>de</strong> · rêver <strong>de</strong> · s'arrêter <strong>de</strong> · se dépêcher <strong>de</strong></td>\n<td class=\"frex\">apprendre <strong>à</strong> · aider qqn <strong>à</strong> · arriver <strong>à</strong> · chercher <strong>à</strong> · commencer <strong>à</strong> · continuer <strong>à</strong> · hésiter <strong>à</strong> · inviter qqn <strong>à</strong> · réussir <strong>à</strong> · se mettre <strong>à</strong></td></tr></table>\n<ul><li>Après un <strong>adjectif</strong> ou un <strong>nom</strong>, on utilise souvent « de » : <span class=\"frex\">Je suis content <strong>de</strong> / heureux <strong>de</strong> / pressé <strong>de</strong> + verbe · J'ai envie <strong>de</strong> / peur <strong>de</strong> / l'habitude <strong>de</strong> + verbe</span><br>⚠️ Mais : <span class=\"frex\">être prêt <strong>à</strong> · être habitué <strong>à</strong> · avoir du mal <strong>à</strong> · avoir tendance <strong>à</strong></span></li>\n<li>Les verbes de <strong>goût</strong> et de <strong>projet</strong> n'ont pas de préposition : <span class=\"frex\">J'adore / Je déteste voyager seul. · J'espère / Je pense partir demain.</span></li></ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">★</span><div><div class=\"slide-lnum\">Bilan</div><div class=\"slide-title\">À retenir</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">🎯 Synthèse</span></div><div class=\"slide-body\"><ul>\n<li><strong style=\"color:#3AABDC\">① Types de verbes</strong> — transitif / intransitif, impersonnel, auxiliaire <strong>être</strong> (maison d'« être », pronominaux) ou <strong>avoir</strong>, voix passive.</li>\n<li><strong style=\"color:#22c55e\">② Modes et temps</strong> — futur proche, passé composé (accord du participe), imparfait, plus-que-parfait, futur simple, futur antérieur.</li>\n<li><strong style=\"color:#EE5818\">③ Conditionnel et hypothèse</strong> — politesse, conseil, désir, imaginaire ; si + présent / imparfait / plus-que-parfait.</li>\n<li><strong style=\"color:#8B6FC0\">④ Négation et discours</strong> — jamais, plus, rien, personne, ni… ni, ne… que ; discours indirect et concordance ; verbe + à / de.</li>\n</ul>\n<div class=\"tip\">⏳ Le verbe porte le temps, le mode et la voix : c'est le cœur de la phrase.</div></div></div>"];

const N=S.length;
let cur=0;

function clearPH(el){
  el.addEventListener('focus',()=>{const p=el.querySelector('.write-placeholder');if(p)p.style.display='none';});
  el.addEventListener('blur',()=>{const p=el.querySelector('.write-placeholder');if(p&&el.innerText.trim()==='')p.style.display='';});
}

function render(idx,smooth){
  cur=idx;
  const sw=document.getElementById('sw');
  sw.classList.add('fade');
  setTimeout(()=>{
    sw.innerHTML=S[cur];
    sw.querySelectorAll('[contenteditable]').forEach(clearPH);
    layout();sw.classList.remove('fade');
    document.getElementById('pf').style.width=((cur+1)/N*100)+'%';
    document.getElementById('pl').textContent=(cur+1)+' / '+N;
    document.getElementById('bp').disabled=cur===0;
    const bn=document.getElementById('bn');
    if(cur===N-1){bn.className='nav-btn done';bn.textContent='✓';bn.disabled=true;}
    else{bn.className='nav-btn';bn.textContent='→';bn.disabled=false;}
    layout();
    if(smooth!==false)window.scrollTo({top:0,behavior:inPresent()?'auto':'smooth'});
  },130);
}

function go(d){const n=cur+d;if(n>=0&&n<N)render(n);}

document.addEventListener('keydown',e=>{
  if(['ArrowRight',' '].includes(e.key)&&!e.target.isContentEditable&&e.target.tagName!=='INPUT'){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'&&!e.target.isContentEditable&&e.target.tagName!=='INPUT'){e.preventDefault();go(-1);}
});
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>55&&!document.activeElement.isContentEditable)go(dx<0?1:-1);
},{passive:true});

const zr=document.getElementById('zr');
const zl_el=document.getElementById('zl');
const sw_el=document.getElementById('sw');
function applyZoom(v){
  v=Math.max(60,Math.min(220,v));zr.value=v;
  zl_el.textContent=v+'%';
  document.documentElement.style.setProperty('--z',v/100);
  if(!document.body.classList.contains('present')){sw_el.style.transform='';sw_el.style.width='';}
  try{localStorage.setItem('mli_gram_verbes_z',v)}catch(e){}
}
zr.addEventListener('input',()=>applyZoom(parseInt(zr.value)));
document.getElementById('zm-').onclick=()=>applyZoom(parseInt(zr.value)-10);
document.getElementById('zm+').onclick=()=>applyZoom(parseInt(zr.value)+10);
try{const zz=parseInt(localStorage.getItem('mli_gram_verbes_z'));if(zz)applyZoom(zz);}catch(e){}

/* ══ MODE PRÉSENTATION + CLAVIER FRANÇAIS + COMPTEUR DE MOTS ══ */
const SW=document.getElementById('sw'),SSW=document.getElementById('ssw'),DESIGN_W=1120;
const CARD=false;
let pz=1;
function inPresent(){return document.body.classList.contains('present');}
function restoreNormal(){
  SW.style.width='';SW.style.height='';SW.style.minHeight='';SW.style.maxWidth='';SW.style.flex='';
  SW.style.transform='';SW.style.transformOrigin='top center';SW.style.margin='';
  if(SSW){SSW.style.height='';SSW.style.width='';SSW.style.maxWidth='';SSW.style.overflow='';}
  if(typeof zr!=='undefined'&&zr)zr.dispatchEvent(new Event('input'));
}
function layout(){
  if(!inPresent()){restoreNormal();return;}
  const s=Math.min(window.innerWidth/DESIGN_W,2.4)*pz;
  const w=window.innerWidth/s;
  SW.style.maxWidth='none';SW.style.transformOrigin='top center';SW.style.margin='0 auto';
  SW.style.width=w+'px';SW.style.transform='scale('+s+')';
  if(CARD){
    SW.style.flex='none';SW.style.height=((window.innerHeight/s)-4)+'px';
    if(SSW){SSW.style.maxWidth='none';SSW.style.width='100%';SSW.style.height='100vh';SSW.style.overflow='hidden';}
  }else{
    SW.style.minHeight=((window.innerHeight/s)-4)+'px';
    if(SSW){SSW.style.maxWidth='none';SSW.style.width='100%';SSW.style.height=SW.getBoundingClientRect().height+'px';}
  }
}
function setSize(d){
  pz=Math.min(2.2,Math.max(.8,Math.round((pz+d*.1)*10)/10));
  const v=document.getElementById('szv');if(v)v.textContent=Math.round(pz*100)+'%';
  layout();
}
function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement;}
function toggleFS(){
  const d=document.documentElement;
  if(!document.body.classList.contains('present')){
    const r=d.requestFullscreen||d.webkitRequestFullscreen;
    if(r){try{const p=r.call(d);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    document.body.classList.add('present');
  }else{
    const x=document.exitFullscreen||document.webkitExitFullscreen;
    if(x){try{x.call(document);}catch(e){}}
    document.body.classList.remove('present');
  }
  setTimeout(layout,120);setTimeout(layout,450);
}
function onFsChange(){
  document.body.classList.toggle('present',!!fsElement());
  const b=document.getElementById('fsb');
  if(b)b.querySelector('.fs-txt').textContent=fsElement()?'Quitter':'Plein écran';
  setTimeout(layout,120);setTimeout(layout,450);
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);
window.addEventListener('resize',()=>layout());
document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable||e.target.tagName==='INPUT')return;
  if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFS();}
  if(e.key==='Escape'&&document.body.classList.contains('present')&&!fsElement()){document.body.classList.remove('present');layout();}
  if(inPresent()){
    if(e.key==='+'||e.key==='='){e.preventDefault();setSize(1);}
    if(e.key==='-'||e.key==='_'){e.preventDefault();setSize(-1);}
    if(e.key==='0'){e.preventDefault();pz=1;const v=document.getElementById('szv');if(v)v.textContent='100%';layout();}
  }else if(typeof zr!=='undefined'&&zr){
    if(e.key==='+'||e.key==='='){e.preventDefault();zr.value=Math.min(+zr.max,+zr.value+10);zr.dispatchEvent(new Event('input'));}
    if(e.key==='-'||e.key==='_'){e.preventDefault();zr.value=Math.max(+zr.min,+zr.value-10);zr.dispatchEvent(new Event('input'));}
    if(e.key==='0'){e.preventDefault();zr.value=100;zr.dispatchEvent(new Event('input'));}
  }
});
/* ── clavier d'accents flottant : toutes les zones de saisie ── */
const ACC=['é','è','ê','ë','à','â','î','ï','ô','û','ù','ç','œ','æ','|','É','È','À','Ç','|','« ',' »','’'];
const accBar=document.createElement('div');accBar.className='acc-bar';
const accCount=document.createElement('span');accCount.className='acc-count';
let curEd=null;
ACC.forEach(ch=>{
  if(ch==='|'){const s=document.createElement('span');s.className='acc-sep';accBar.appendChild(s);return;}
  const b=document.createElement('button');b.type='button';b.className='acc-key';b.textContent=ch.trim()||ch;
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('click',()=>{
    if(!curEd)return;
    const p=curEd.querySelector?curEd.querySelector('.write-placeholder'):null;if(p)p.style.display='none';
    curEd.focus();
    if(curEd.tagName==='INPUT'||curEd.tagName==='TEXTAREA'){
      const s=curEd.selectionStart||0,e2=curEd.selectionEnd||0;
      curEd.value=curEd.value.slice(0,s)+ch+curEd.value.slice(e2);
      curEd.selectionStart=curEd.selectionEnd=s+ch.length;
    }else{document.execCommand('insertText',false,ch);}
    updCount();
  });
  accBar.appendChild(b);
});
accBar.appendChild(accCount);
document.body.appendChild(accBar);
function edText(el){
  if(el.tagName==='INPUT'||el.tagName==='TEXTAREA')return el.value||'';
  const p=el.querySelector('.write-placeholder');
  let t=el.innerText||'';
  if(p&&p.offsetParent!==null&&p.innerText)t=t.split(p.innerText).join('');
  return t;
}
function updCount(){
  if(!curEd)return;
  const m=edText(curEd).match(/[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*/g);
  const n=m?m.length:0;
  const mn=parseInt(curEd.dataset.min||0),mx=parseInt(curEd.dataset.max||0);
  accCount.className='acc-count';
  if(mn&&mx){
    accCount.textContent=n+' / '+mn+'–'+mx+' mots';
    const st=(n===0?'':(n<mn?'under':(n>mx?'over':'ok')));
    if(st)accCount.classList.add(st);
  }else{accCount.textContent=n+(n>1?' mots':' mot');}
}
function edOf(t){return t&&t.closest?t.closest('[contenteditable],input[type=text],textarea'):null;}
document.addEventListener('focusin',e=>{const ed=edOf(e.target);if(ed){curEd=ed;accBar.classList.add('on');updCount();}});
/* en plein écran : empêche le focus d'une zone de saisie de faire remonter la diapo */
document.addEventListener('focusin',()=>{
  if(!inPresent())return;
  setTimeout(()=>{document.querySelectorAll('.stage,.slide-scale-wrap').forEach(el=>{el.scrollTop=0;el.scrollLeft=0;});},0);
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(!edOf(document.activeElement))accBar.classList.remove('on');},160);});
document.addEventListener('input',e=>{const ed=edOf(e.target);if(ed){curEd=ed;updCount();}});

render(0,false);layout();

</script>
</body></html>
