 class=\"section-chip\" style=\"background:#3AABDC18;color:#3AABDC\">Commun / propre</span><span class=\"section-chip\" style=\"background:#3AABDC18;color:#3AABDC\">Comptable</span><span class=\"section-chip\" style=\"background:#3AABDC18;color:#3AABDC\">Genre</span><span class=\"section-chip\" style=\"background:#3AABDC18;color:#3AABDC\">Pluriel</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Le nom · Catégories</div><div class=\"slide-title\">Nom propre / nom commun</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">🗂 Catégories</span></div><div class=\"slide-body\"><h3 class=\"sec-h3\" style=\"color:#3AABDC\">Le nom propre </h3>\n        <div class=\"rulebox\">La <strong>première lettre</strong> prend toujours une <strong>majuscule</strong>.</div>\n        <div class=\"cols2 frex\">\n          <span>la <strong>F</strong>rance · <strong>P</strong>aris</span><span>l'<strong>E</strong>urope · les <strong>A</strong>lpes</span>\n          <span>un <strong>P</strong>arisien · les <strong>C</strong>hinois</span><span>les <strong>T</strong>hibault (une famille)</span>\n        </div>\n        <h3 class=\"sec-h3\" style=\"color:#3AABDC\">Nom comptable / non comptable </h3>\n        <ul>\n          <li><strong>Comptable</strong> — on peut compter : <span class=\"frex\">un livre, deux livres…</span></li>\n          <li><strong>Non comptable</strong> — sans forme plurielle en général : matières, notions abstraites.</li>\n        </ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Le nom · Non comptable</div><div class=\"slide-title\">Les noms non comptables</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">💧 Sans pluriel</span></div><div class=\"slide-body\"><div class=\"rulebox\">Les non comptables désignent une matière ou une notion <strong>sans forme définie</strong>.</div>\n        <div class=\"qcat-grid\">\n          <div class=\"q-item\"><div class=\"q-bullet\">⛏️</div><div class=\"q-text\"><strong>Minerais / matières</strong> — <span class=\"frex\">le fer, l'or, le charbon</span></div></div>\n          <div class=\"q-item\"><div class=\"q-bullet\">🥗</div><div class=\"q-text\"><strong>Chimie / aliments</strong> — <span class=\"frex\">le sel, l'eau, la viande, le lait</span></div></div>\n          <div class=\"q-item\"><div class=\"q-bullet\">🧱</div><div class=\"q-text\"><strong>Produits</strong> — <span class=\"frex\">le ciment, le plâtre, la bière</span></div></div>\n        </div>\n        <div class=\"tip\">⚠️ S'ils deviennent <strong>comptables</strong>, le sens change : <span class=\"frex\">deux bœufs → du bœuf</span> · <span class=\"frex\">un café → du café</span>.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Le nom · Genre</div><div class=\"slide-title\">Masculin / féminin des personnes</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">⚥ Personnes</span></div><div class=\"slide-body\"><div class=\"rulebox\">Pour les <strong>personnes</strong>, le genre suit le sexe. Règle générale : <strong>masculin + e</strong>.</div>\n        <table class=\"gtab\"><tr><th>Formation</th><th>Masculin</th><th>Féminin</th></tr>\n        <tr><td>+ <span class=\"gend\">e</span></td><td class=\"frex\">un étudiant</td><td class=\"frex\">une étudiant<strong>e</strong></td></tr>\n        <tr><td>déjà en <span class=\"gend\">-e</span> → article seul</td><td class=\"frex\">un concierge</td><td class=\"frex\"><strong>une</strong> concierge</td></tr>\n        <tr><td><span class=\"gend\">-en → -enne</span></td><td class=\"frex\">un musicien</td><td class=\"frex\">une musici<strong>enne</strong></td></tr>\n        <tr><td><span class=\"gend\">-on → -onne</span></td><td class=\"frex\">un champion</td><td class=\"frex\">une champi<strong>onne</strong></td></tr>\n        <tr><td><span class=\"gend\">-eur → -euse</span></td><td class=\"frex\">un serveur</td><td class=\"frex\">une serv<strong>euse</strong></td></tr>\n        <tr><td><span class=\"gend\">-teur → -trice</span></td><td class=\"frex\">un acteur</td><td class=\"frex\">une ac<strong>trice</strong></td></tr>\n        </table>\n        <div class=\"tip\">⚠️ Parfois <strong>-teur → -teuse</strong> : <span class=\"frex\">une chanteuse, une menteuse, une conteuse</span>.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Le nom · Genre</div><div class=\"slide-title\">Terminaisons masculines des choses</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">♂ Terminaisons</span></div><div class=\"slide-body\"><div class=\"rulebox\">Pour les <strong>choses</strong>, la terminaison indique souvent le genre.</div>\n        <table class=\"gtab\">\n        <tr><td><span class=\"gend\">-age</span></td><td class=\"frex\">le garage, le fromage, le ménage…</td></tr>\n        <tr><td><span class=\"gend\">-ment</span></td><td class=\"frex\">le gouvernement, le monument, le médicament…</td></tr>\n        <tr><td><span class=\"gend\">-eau</span></td><td class=\"frex\">le bureau, le couteau, le carreau…</td></tr>\n        <tr><td><span class=\"gend\">-phone / -scope</span></td><td class=\"frex\">un téléphone, un interphone, un microscope…</td></tr>\n        <tr><td><span class=\"gend\">-isme</span></td><td class=\"frex\">le réalisme, le socialisme…</td></tr>\n        </table>\n        <div class=\"tip\">⚠️ Mais féminins : <span class=\"frex\">la plage, la cage, la page, la nage, l'image, la rage</span>.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Le nom · Genre</div><div class=\"slide-title\">Terminaisons féminines des choses</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">♀ Terminaisons</span></div><div class=\"slide-body\"><table class=\"gtab\">\n        <tr><td><span class=\"gend\">-tion</span></td><td class=\"frex\">la situation, la solution, la réalisation…</td></tr>\n        <tr><td><span class=\"gend\">-sion</span></td><td class=\"frex\">la décision, la télévision…</td></tr>\n        <tr><td><span class=\"gend\">-té</span></td><td class=\"frex\">la société, la réalité, la bonté, la beauté…</td></tr>\n        <tr><td><span class=\"gend\">-ette</span></td><td class=\"frex\">la bicyclette, la trompette, la cigarette…</td></tr>\n        <tr><td><span class=\"gend\">-ance / -ence</span></td><td class=\"frex\">la connaissance, la différence, la présence…</td></tr>\n        <tr><td><span class=\"gend\">-ure</span></td><td class=\"frex\">la culture, la peinture, la nourriture…</td></tr>\n        <tr><td><span class=\"gend\">-ode / -ade / -ude</span></td><td class=\"frex\">la méthode, la salade, la certitude…</td></tr>\n        </table>\n        <div class=\"tip\">⚠️ Mais masculins : <span class=\"frex\">le côté, l'été, le député · le squelette · le silence · le mercure</span>.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Le nom · Genre</div><div class=\"slide-title\">Attention aux irréguliers</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">⚠️ À retenir</span></div><div class=\"slide-body\"><h3 class=\"sec-h3\" style=\"color:#3AABDC\">Beaucoup de noms en <strong>-e</strong> sont masculins </h3>\n        <div class=\"cols2 frex\"><span>un problème · un système</span><span>un programme · un volume</span><span>un modèle · un groupe</span><span>un domaine · un rôle</span></div>\n        <h3 class=\"sec-h3\" style=\"color:#3AABDC\">Quelques noms en <strong>-eur</strong> sont féminins </h3>\n        <div class=\"cols2 frex\"><span>la couleur · l'odeur</span><span>la saveur · la peur</span><span>la douleur · la fleur</span><span>l'erreur · la valeur</span></div>\n        <h3 class=\"sec-h3\" style=\"color:#3AABDC\">Les noms d'animaux — genre souvent unique </h3>\n        <div class=\"cols2 frex\"><span>la mouche, la souris, la tortue</span><span>le poisson, le pigeon, le moineau</span></div>\n        <div class=\"tip\">Mais : <span class=\"frex\">le chat / la chatte · le coq / la poule · le cheval / la jument</span>.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Le nom · Pluriel</div><div class=\"slide-title\">Le pluriel : règles de base</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">🔢 Pluriel</span></div><div class=\"slide-body\"><div class=\"rulebox\">En général on ajoute un <strong>-s</strong>. Les noms en <strong>-s, -x, -z</strong> ne changent pas.<br><span class=\"frex\">un livre → des livres · un choix → des choix · un nez → des nez</span></div>\n        <h3 class=\"sec-h3\" style=\"color:#3AABDC\"><span class=\"gend\">-al / -au → -aux</span></h3>\n        <div class=\"cols2 frex\"><span>un journal → des journ<strong>aux</strong></span><span>un tableau → des tabl<strong>eaux</strong></span></div>\n        <div class=\"tip\">⚠️ Mais : <span class=\"frex\">des festivals, des carnavals, des bals</span>.</div>\n        <h3 class=\"sec-h3\" style=\"color:#3AABDC\"><span class=\"gend\">-ail → -ails</span> (régulier)</h3>\n        <div class=\"cols2 frex\"><span>des rails, des éventails</span><span>des portails, des détails</span></div>\n        <div class=\"tip\">⚠️ Mais : <span class=\"frex\">des travaux, des vitraux, des émaux</span>.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">1</span><div><div class=\"slide-lnum\">① Le nom · Pluriel</div><div class=\"slide-title\">Pluriels particuliers : -eu, -ou</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">🔢 Pluriel</span></div><div class=\"slide-body\"><h3 class=\"sec-h3\" style=\"color:#3AABDC\"><span class=\"gend\">-eu → -eux</span></h3>\n        <div class=\"cols2 frex\"><span>un cheveu → des chev<strong>eux</strong></span><span>un jeu → des j<strong>eux</strong></span></div>\n        <div class=\"tip\">⚠️ Mais : <span class=\"frex\">des bleus, des pneus</span>.</div>\n        <h3 class=\"sec-h3\" style=\"color:#3AABDC\">Quelques <span class=\"gend\">-ou → -oux</span></h3>\n        <div class=\"rulebox frex\">des bij<strong>oux</strong> · des caill<strong>oux</strong> · des ch<strong>oux</strong> · des gen<strong>oux</strong><br>des hib<strong>oux</strong> · des jouj<strong>oux</strong> · des p<strong>oux</strong>\n        <div style=\"margin-top:.3rem\">⚠️ Mais : <span class=\"gmais\">des bisous</span> (régulier).</div></div>\n        </div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e\"><div class=\"section-div\"><div class=\"section-div-inner\"><div class=\"section-icon\">②</div><div class=\"section-title\" style=\"color:#22c55e\">Partie 2 — Les déterminants</div><div class=\"section-sub\">Articles, possessifs et démonstratifs</div><div class=\"section-chips\"><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Indéfini / défini</span><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Contracté</span><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Partitif</span><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Possessif</span><span class=\"section-chip\" style=\"background:#22c55e18;color:#22c55e\">Démonstratif</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#0ea5e9;--tint:#E0F2FE\"><div class=\"slide-hdr\" style=\"background:#E0F2FE;border-left:5px solid #0ea5e9\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#0ea5e9\">2</span><div><div class=\"slide-lnum\">② Déterminants · Article</div><div class=\"slide-title\">Indéfini vs défini</div></div></div><span class=\"type-pill\" style=\"background:#0ea5e918;color:#0ea5e9;border:1.5px solid #0ea5e940\">le / un</span></div><div class=\"slide-body\"><h3 class=\"sec-h3\" style=\"color:#0ea5e9\">L'article indéfini <strong>un / une / des</strong></h3>\n        <div class=\"rulebox\">Désigne une <strong>catégorie</strong> ou exprime l'<strong>unité</strong> (= 1).<br><span class=\"frex\">une tour moderne · un boulanger · J'ai un chien, une chatte.</span></div>\n        <h3 class=\"sec-h3\" style=\"color:#0ea5e9\">L'article défini <strong>le / la / les</strong></h3>\n        <ul>\n          <li>Une chose <strong>en particulier</strong> : <span class=\"frex\">la tour Eiffel</span></li>\n          <li>Une <strong>généralité</strong> : <span class=\"frex\">la liberté, le bonheur, l'amour</span></li>\n          <li>Reprend un nom <strong>déjà mentionné</strong> : <span class=\"frex\">J'ai un chien… Le chien est blanc.</span></li>\n          <li>Après les <strong>verbes de goût</strong> (aimer, détester…) : <span class=\"frex\">J'aime la laine.</span></li>\n        </ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#0ea5e9;--tint:#E0F2FE\"><div class=\"slide-hdr\" style=\"background:#E0F2FE;border-left:5px solid #0ea5e9\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#0ea5e9\">2</span><div><div class=\"slide-lnum\">② Déterminants · Article</div><div class=\"slide-title\">Les articles contractés</div></div></div><span class=\"type-pill\" style=\"background:#0ea5e918;color:#0ea5e9;border:1.5px solid #0ea5e940\">du / au</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>Contraction</th><th>Exemple</th></tr>\n        <tr><td><strong>du</strong> = de + le</td><td class=\"frex\">la voiture <strong>du</strong> directeur</td></tr>\n        <tr><td><strong>des</strong> = de + les</td><td class=\"frex\">le chien <strong>des</strong> voisins</td></tr>\n        <tr><td><strong>au</strong> = à + le</td><td class=\"frex\">il est <strong>au</strong> bureau</td></tr>\n        <tr><td><strong>aux</strong> = à + les</td><td class=\"frex\">ils vont <strong>aux</strong> sports d'hiver</td></tr>\n        </table>\n        <div class=\"tip\">⚠️ <strong>à la, à l', de la, de l'</strong> ne se contractent <u>pas</u> : <span class=\"frex\">à la gare · de l'aéroport</span>.</div>\n        <div class=\"rulebox\">Distinguer <strong>des</strong> contracté (de+les) et <strong>des</strong> indéfini :<br><span class=\"frex\">Je parle <strong>des</strong> Français.</span> (= tous) &nbsp;·&nbsp; <span class=\"frex\">Je connais <strong>des</strong> Français.</span> (= quelques)</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#0ea5e9;--tint:#E0F2FE\"><div class=\"slide-hdr\" style=\"background:#E0F2FE;border-left:5px solid #0ea5e9\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#0ea5e9\">2</span><div><div class=\"slide-lnum\">② Déterminants · Article</div><div class=\"slide-title\">Constructions avec « de » / « à »</div></div></div><span class=\"type-pill\" style=\"background:#0ea5e918;color:#0ea5e9;border:1.5px solid #0ea5e940\">🧩 Emplois</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>Sens</th><th>Exemple</th></tr>\n        <tr><td><strong>appartenance</strong></td><td class=\"frex\">le vélo <strong>du</strong> professeur · la couleur <strong>de la</strong> mer</td></tr>\n        <tr><td><strong>lieu</strong></td><td class=\"frex\">à côté <strong>du</strong> métro · je suis <strong>au</strong> bureau · je vais <strong>au</strong> café</td></tr>\n        <tr><td><strong>= avec</strong></td><td class=\"frex\">une pizza <strong>au</strong> jambon · un homme <strong>aux</strong> yeux bleus</td></tr>\n        </table></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Déterminants · Partitif</div><div class=\"slide-title\">Les partitifs</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🍚 du / de la</span></div><div class=\"slide-body\"><div class=\"rulebox\">Pour une <strong>quantité indéterminée</strong> : « de » + article défini.</div>\n        <table class=\"gtab\"><tr><td class=\"frex\">de la viande</td><td class=\"frex\">de l'huile</td></tr>\n        <tr><td class=\"frex\">du poisson (de+le)</td><td class=\"frex\">des fruits (de+les)</td></tr></table>\n        <div class=\"rulebox\">Défini = l'ensemble ; partitif = une <strong>partie</strong>.<br><span class=\"frex\">Le lait est bon pour la santé (= tout) · Buvez du lait (= une partie)</span></div>\n        <div class=\"tip\">Dites : <span class=\"frex\">Le matin, je bois <strong>du</strong> thé · je mange <strong>des</strong> pâtes.</span> (jamais « le thé / les pâtes » ici)</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Déterminants · Partitif</div><div class=\"slide-title\">« Des », « de » et « sans »</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">⚠️ Nuances</span></div><div class=\"slide-body\"><ul>\n          <li><strong>Des</strong> = indéfini (pl. de « un ») <u>ou</u> partitif (de+les) : <span class=\"frex\">des tomates (2,3) · des rillettes (de+les)</span></li>\n          <li>« De » se contracte avec <strong>le / les</strong>, mais pas avec <strong>la / l'</strong> : <span class=\"frex\">de la salade, de l'huile, du vinaigre, des épices</span></li>\n          <li>Pas de partitif après <strong>sans</strong> : <span class=\"frex\">Je mange de la salade <strong>sans</strong> huile, <strong>sans</strong> vinaigre.</span></li>\n        </ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Déterminants · Quantité</div><div class=\"slide-title\">Quantité exprimée &amp; négation</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">➗ de</span></div><div class=\"slide-body\"><div class=\"rulebox\"><strong>« De »</strong> remplace du / de la / des quand la quantité est <strong>exprimée</strong>.</div>\n        <table class=\"gtab\"><tr><th>Type</th><th>Exemple</th></tr>\n        <tr><td>quantité précise</td><td class=\"frex\">un kilo <strong>de</strong> sucre · cent grammes <strong>de</strong> sucre</td></tr>\n        <tr><td>quantité globale</td><td class=\"frex\">beaucoup <strong>de</strong> sucre · un peu <strong>de</strong> sucre · assez <strong>de</strong>…</td></tr>\n        <tr><td>quantité-forme</td><td class=\"frex\">un morceau <strong>de</strong> sucre · un paquet <strong>de</strong>…</td></tr>\n        </table>\n        <div class=\"tip\">Dites : <span class=\"frex\">Paul a beaucoup <strong>d'</strong>amis.</span> (jamais « des amis » ici)</div>\n        <h3 class=\"sec-h3\" style=\"color:#22c55e\">La négation → quantité zéro</h3>\n        <div class=\"rulebox frex\">Je n'achète <strong>pas de</strong> viande · <strong>jamais de</strong> poisson · <strong>plus de</strong> fruits.\n        <div style=\"margin-top:.3rem\">⚠️ Mais on garde le partitif dans une opposition : <span class=\"frex\">Ce n'est <strong>pas du</strong> miel, c'est <strong>de la</strong> confiture.</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Déterminants · Possessif</div><div class=\"slide-title\">L'adjectif possessif</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">👪 mon / ma / mes</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th></th><th>Masc.</th><th>Fém.</th><th>Pluriel</th></tr>\n        <tr><td>Je</td><td class=\"frex\"><strong>mon</strong> père</td><td class=\"frex\"><strong>ma</strong> mère</td><td class=\"frex\"><strong>mes</strong> parents</td></tr>\n        <tr><td>Tu</td><td class=\"frex\"><strong>ton</strong> fils</td><td class=\"frex\"><strong>ta</strong> fille</td><td class=\"frex\"><strong>tes</strong> enfants</td></tr>\n        <tr><td>Il/Elle</td><td class=\"frex\"><strong>son</strong> cousin</td><td class=\"frex\"><strong>sa</strong> cousine</td><td class=\"frex\"><strong>ses</strong> cousins</td></tr>\n        <tr><td>Nous</td><td class=\"frex\"><strong>notre</strong> père</td><td class=\"frex\"><strong>notre</strong> mère</td><td class=\"frex\"><strong>nos</strong> parents</td></tr>\n        <tr><td>Vous</td><td class=\"frex\"><strong>votre</strong> fils</td><td class=\"frex\"><strong>votre</strong> fille</td><td class=\"frex\"><strong>vos</strong> enfants</td></tr>\n        <tr><td>Ils/Elles</td><td class=\"frex\"><strong>leur</strong> cousin</td><td class=\"frex\"><strong>leur</strong> cousine</td><td class=\"frex\"><strong>leurs</strong> cousins</td></tr>\n        </table>\n        <ul>\n          <li><strong>ma/ta/sa → mon/ton/son</strong> devant voyelle ou « h » muet : <span class=\"frex\">mon amie, ton erreur, son hésitation</span></li>\n          <li>Parties du corps → article défini : <span class=\"frex\">J'ai mal <strong>à la</strong> tête.</span></li>\n        </ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Déterminants · Démonstratif</div><div class=\"slide-title\">L'adjectif démonstratif</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">👉 ce / cette / ces</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>Masc.</th><th>Masc. + voyelle</th><th>Fém.</th><th>Pluriel</th></tr>\n        <tr><td class=\"frex\"><strong>ce</strong> pont</td><td class=\"frex\"><strong>cet</strong> ami</td><td class=\"frex\"><strong>cette</strong> église</td><td class=\"frex\"><strong>ces</strong> statues</td></tr></table>\n        <ul>\n          <li>Choses présentes, proches ou lointaines ; + <strong>là-bas</strong> pour l'éloignement : <span class=\"frex\">Ce monument, là-bas, c'est l'Opéra.</span></li>\n          <li>Période de temps proche : <span class=\"frex\">ce matin, cette semaine, cet été</span> ; + <strong>-ci / -là</strong> : <span class=\"frex\">ce mois-ci / ce mois-là</span></li>\n          <li><strong>ce → cet</strong> devant voyelle ou « h » muet : <span class=\"frex\">cet homme</span></li>\n        </ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#22c55e;--tint:#DCFCE7\"><div class=\"slide-hdr\" style=\"background:#DCFCE7;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">2</span><div><div class=\"slide-lnum\">② Déterminants · Démonstratif</div><div class=\"slide-title\">Le pronom démonstratif</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">🔁 celui / celle</span></div><div class=\"slide-body\"><div class=\"rulebox\">Évite la répétition ; surtout composé avec <strong>-ci / -là</strong>.</div>\n        <table class=\"gtab\"><tr><th></th><th>Adjectif</th><th>Pronom</th></tr>\n        <tr><td>masc. sing.</td><td class=\"frex\">ce vélo</td><td class=\"frex\"><strong>celui</strong>-ci / -là</td></tr>\n        <tr><td>fém. sing.</td><td class=\"frex\">cette moto</td><td class=\"frex\"><strong>celle</strong>-ci / -là</td></tr>\n        <tr><td>masc. pl.</td><td class=\"frex\">ces vélos</td><td class=\"frex\"><strong>ceux</strong>-ci / -là</td></tr>\n        <tr><td>fém. pl.</td><td class=\"frex\">ces motos</td><td class=\"frex\"><strong>celles</strong>-ci / -là</td></tr>\n        </table>\n        <div class=\"tip\"><strong>celui de, celle de…</strong> expriment la possession : <span class=\"frex\">À qui est ce vélo ? — C'est <strong>celui de</strong> Léa.</span></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818\"><div class=\"section-div\"><div class=\"section-div-inner\"><div class=\"section-icon\">③</div><div class=\"section-title\" style=\"color:#EE5818\">Partie 3 — Les prépositions</div><div class=\"section-sub\">Lieu, temps, direction et relation</div><div class=\"section-chips\"><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Villes / pays</span><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Position</span><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Temps</span><span class=\"section-chip\" style=\"background:#EE581818;color:#EE5818\">Approximation</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Prépositions</div><div class=\"slide-title\">Les prépositions courantes</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">📍 Aperçu</span></div><div class=\"slide-body\"><div class=\"qcat-grid\">\n          <div class=\"q-item\"><div class=\"q-bullet\">à</div><div class=\"q-text\">point dans l'espace / le temps</div></div>\n          <div class=\"q-item\"><div class=\"q-bullet\">de</div><div class=\"q-text\">origine, point de départ, appartenance</div></div>\n          <div class=\"q-item\"><div class=\"q-bullet\">dans</div><div class=\"q-text\">espace fermé</div></div>\n          <div class=\"q-item\"><div class=\"q-bullet\">en</div><div class=\"q-text\">pays féminin, matière, durée</div></div>\n          <div class=\"q-item\"><div class=\"q-bullet\">par</div><div class=\"q-text\">passage, moyen</div></div>\n          <div class=\"q-item\"><div class=\"q-bullet\">pour</div><div class=\"q-text\">but, destination</div></div>\n          <div class=\"q-item\"><div class=\"q-bullet\">avec / sans</div><div class=\"q-text\">accompagnement / absence</div></div>\n        </div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Prépositions · Lieu</div><div class=\"slide-title\">Villes, pays, continents</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">🌍 à / en / au</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>Règle</th><th>Exemple</th></tr>\n        <tr><td><strong>à</strong> + ville</td><td class=\"frex\">Je suis <strong>à</strong> Paris · <strong>à</strong> Cuba</td></tr>\n        <tr><td><strong>en</strong> + pays fém. / continent</td><td class=\"frex\">en France · en Russie · en Europe</td></tr>\n        <tr><td><strong>au</strong> + pays masc.</td><td class=\"frex\">au Brésil · au Canada</td></tr>\n        <tr><td><strong>aux</strong> + pays pluriel</td><td class=\"frex\">aux États-Unis · aux Pays-Bas</td></tr>\n        </table>\n        <div class=\"tip\">🎵 <strong>en</strong> devant tout pays singulier commençant par une voyelle : <span class=\"frex\">en Iran, en Angola</span>.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Prépositions · Position</div><div class=\"slide-title\">dans / sur / sous</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">📦 Position</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>Préposition</th><th>Sens &amp; exemple</th></tr>\n        <tr><td><strong>dans</strong></td><td>espace fermé — <span class=\"frex\">dans la maison, dans le tiroir</span></td></tr>\n        <tr><td><strong>sur</strong></td><td>une surface — <span class=\"frex\">sur le toit, sur la photo</span></td></tr>\n        <tr><td><strong>sous</strong></td><td>en dessous — <span class=\"frex\">sous le parapluie</span></td></tr>\n        </table>\n        <h3 class=\"sec-h3\" style=\"color:#EE5818\">Cas particuliers </h3>\n        <div class=\"cols2 frex\"><span>dans la rue · dans le journal</span><span>sur la place · sur le boulevard</span><span>à la radio · à la télévision</span><span>sur Internet · sur une chaise</span></div>\n        <div class=\"tip\">Dites : <span class=\"frex\">Je suis <strong>dans</strong> le train · <strong>À la</strong> télévision, il y a…</span> (pas « sur le train / sur la télévision »)</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Prépositions · Position</div><div class=\"slide-title\">Haut / bas · proche / loin</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">↕️ Repères</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>Préposition</th><th>Sens &amp; exemple</th></tr>\n        <tr><td><strong>au-dessus (de)</strong></td><td>niveau plus haut — <span class=\"frex\">au-dessus de l'Atlantique</span></td></tr>\n        <tr><td><strong>au-dessous (de)</strong></td><td>niveau plus bas — <span class=\"frex\">au-dessous du 5ᵉ étage : au 4ᵉ</span></td></tr>\n        <tr><td><strong>dessus / dessous</strong></td><td class=\"frex\">Il est dessus. / Il est dessous.</td></tr>\n        <tr><td><strong>dedans / dehors</strong></td><td class=\"frex\">Il est dedans. / Il est dehors.</td></tr>\n        <tr><td><strong>à côté de / près de</strong></td><td>proximité — <span class=\"frex\">Versailles est près de Paris.</span></td></tr>\n        <tr><td><strong>loin de</strong></td><td>éloignement — <span class=\"frex\">Moscou est loin de Paris.</span></td></tr>\n        </table></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Prépositions · Temps</div><div class=\"slide-title\">Point, distance, limite, départ</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">⏱ Temps &amp; espace</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>Préposition</th><th>Valeur &amp; exemple</th></tr>\n        <tr><td><strong>à</strong></td><td>un point — <span class=\"frex\">Je termine à dix-huit heures.</span></td></tr>\n        <tr><td><strong>de… à</strong></td><td>une distance — <span class=\"frex\">de 8 heures à midi · du lundi au vendredi</span></td></tr>\n        <tr><td><strong>jusqu'à</strong></td><td>une limite — <span class=\"frex\">on travaille jusqu'à 62 ans</span></td></tr>\n        <tr><td><strong>à partir de</strong></td><td>un point de départ — <span class=\"frex\">à partir du 22 septembre</span></td></tr>\n        </table></div></div>", "<div class=\"content-slide\" style=\"--acc:#EE5818;--tint:#FDE8DC\"><div class=\"slide-hdr\" style=\"background:#FDE8DC;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">3</span><div><div class=\"slide-lnum\">③ Prépositions · Relation</div><div class=\"slide-title\">Approximation &amp; entre / parmi</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">≈ Relation</span></div><div class=\"slide-body\"><h3 class=\"sec-h3\" style=\"color:#EE5818\">vers / environ — approximation </h3>\n        <ul>\n          <li><strong>environ</strong> + quantité : <span class=\"frex\">Paul a environ 30 ans.</span></li>\n          <li><strong>vers</strong> + heure (sauf « il est ») : <span class=\"frex\">Nous dînons vers huit heures.</span></li>\n        </ul>\n        <h3 class=\"sec-h3\" style=\"color:#EE5818\">entre / parmi</h3>\n        <ul>\n          <li><strong>entre</strong> deux éléments : <span class=\"frex\">« B » est entre « A » et « C ».</span></li>\n          <li><strong>parmi</strong> plusieurs éléments : <span class=\"frex\">une lettre parmi les lettres de l'alphabet</span></li>\n          <li><strong>entre nous / entre eux</strong> = à l'exclusion des autres.</li>\n        </ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0\"><div class=\"section-div\"><div class=\"section-div-inner\"><div class=\"section-icon\">④</div><div class=\"section-title\" style=\"color:#8B6FC0\">Partie 4 — Adjectifs &amp; adverbes</div><div class=\"section-sub\">Place, sens, quantité et comparaison</div><div class=\"section-chips\"><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">Place</span><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">neuf / nouveau</span><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">tout / chaque</span><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">Adverbes</span><span class=\"section-chip\" style=\"background:#8B6FC018;color:#8B6FC0\">Comparatif</span></div></div></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Adjectif · Place</div><div class=\"slide-title\">La place de l'adjectif</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">📐 Place</span></div><div class=\"slide-body\"><div class=\"rulebox\">En général, l'adjectif se place <strong>après</strong> le nom.<br><span class=\"frex\">une chemise blanche · un livre intéressant · un exercice difficile</span></div>\n        <h3 class=\"sec-h3\" style=\"color:#8B6FC0\">Mais <strong>devant</strong> le nom </h3>\n        <div class=\"cols2 frex\"><span>beau / joli</span><span>bon / mauvais</span><span>petit / grand / gros</span><span>nouveau / jeune / vieux</span><span>double / demi</span><span>autre / même</span></div>\n        <div class=\"rulebox frex\" style=\"margin-top:.5rem\">une <strong>petite</strong> maison · une <strong>jolie</strong> robe · un <strong>gros</strong> livre</div>\n        <ul>\n          <li>Les <strong>nombres</strong> se placent devant : <span class=\"frex\">les trois mousquetaires · le septième art</span></li>\n          <li>Plusieurs adjectifs → le nombre en premier : <span class=\"frex\">les trois petits cochons</span></li>\n        </ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Adjectif · Place</div><div class=\"slide-title\">premier / dernier · bel / vieil</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">✨ Formes</span></div><div class=\"slide-body\"><ul>\n          <li><strong>premier, dernier, prochain</strong> devant le nom pour une <strong>série</strong> : <span class=\"frex\">le premier candidat, le prochain candidat</span></li>\n          <li>Mais <strong>dernier / prochain</strong> après le nom pour une <strong>date</strong> : <span class=\"frex\">mardi dernier · le mois prochain</span></li>\n        </ul>\n        <div class=\"rulebox\">🎵 <strong>beau, vieux, nouveau → bel, vieil, nouvel</strong> devant voyelle ou « h » muet :<br><span class=\"frex\">un <strong>bel</strong> acteur · un <strong>vieil</strong> homme · un <strong>nouvel</strong> ordinateur</span></div>\n        <ul>\n          <li>Devant un adjectif, <strong>des → de</strong> : <span class=\"frex\">de bons amis · de beaux livres</span></li>\n          <li>Liaison obligatoire : <span class=\"frex\">un peti<u>t</u>_enfant · un bo<u>n</u>_acteur · de gran<u>d</u>s_amis</span></li>\n        </ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Adjectif · Sens</div><div class=\"slide-title\">« neuf » ou « nouveau » ?</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🆕 neuf / nouveau</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>neuf </th><th>nouveau </th></tr>\n        <tr><td>de fabrication récente — <u>après</u> le nom</td><td>différent d'avant — <u>avant</u> le nom</td></tr>\n        <tr><td class=\"frex\">une voiture <strong>neuve</strong> · un stylo <strong>neuf</strong></td><td class=\"frex\">une <strong>nouvelle</strong> voiture · une <strong>nouvelle</strong> adresse</td></tr>\n        <tr><td>pour les <strong>objets</strong></td><td>pour tout <strong>changement</strong></td></tr>\n        <tr><td class=\"frex\">≠ vieux / vieille</td><td class=\"frex\">≠ ancien / ancienne</td></tr>\n        </table>\n        <div class=\"tip\">Mais : <span class=\"frex\">Quoi de <strong>neuf</strong> ?</span> = Qu'est-ce qui est nouveau dans votre vie ?</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Adjectif · Sens</div><div class=\"slide-title\">Adjectifs à sens variable</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🔀 Avant / après</span></div><div class=\"slide-body\"><div class=\"rulebox\">Certains adjectifs <strong>changent de sens</strong> selon leur place ; devant le nom, ils sont plus <strong>subjectifs</strong>.</div>\n        <table class=\"gtab\"><tr><th>Après (objectif)</th><th>Avant (subjectif)</th></tr>\n        <tr><td class=\"frex\">un homme <strong>grand</strong> (de haute taille)</td><td class=\"frex\">un <strong>grand</strong> homme (remarquable)</td></tr>\n        <tr><td class=\"frex\">un homme <strong>pauvre</strong> (sans argent)</td><td class=\"frex\">un <strong>pauvre</strong> homme (malheureux)</td></tr>\n        <tr><td class=\"frex\">une femme <strong>seule</strong> (sans amis)</td><td class=\"frex\">une <strong>seule</strong> femme (unique)</td></tr>\n        <tr><td class=\"frex\">une maison <strong>chère</strong> (prix élevé)</td><td class=\"frex\">ma <strong>chère</strong> maison (affectif)</td></tr>\n        <tr><td class=\"frex\">un immeuble <strong>ancien</strong> (époque passée)</td><td class=\"frex\">mon <strong>ancien</strong> immeuble (précédent)</td></tr>\n        </table></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Adjectif · Quantité</div><div class=\"slide-title\">Adjectifs indéfinis · « tout »</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🔢 tout / chaque</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>Adjectif</th><th>Sens</th></tr>\n        <tr><td class=\"frex\"><strong>quelques</strong> étudiants</td><td>petit nombre</td></tr>\n        <tr><td class=\"frex\"><strong>plusieurs</strong> étudiants</td><td>nombre plus important</td></tr>\n        <tr><td class=\"frex\"><strong>chaque</strong> étudiant</td><td>individu séparé</td></tr>\n        <tr><td class=\"frex\"><strong>tous / toutes</strong> les étudiants</td><td>totalité</td></tr>\n        <tr><td class=\"frex\"><strong>certains / d'autres</strong></td><td>partie de l'ensemble</td></tr>\n        <tr><td class=\"frex\"><strong>aucun(e)</strong></td><td>quantité zéro</td></tr>\n        </table>\n        <table class=\"gtab\" style=\"margin-top:.4rem\"><tr><th></th><th>Masculin</th><th>Féminin</th></tr>\n        <tr><td>sing.</td><td class=\"frex\"><strong>tout</strong> le groupe</td><td class=\"frex\"><strong>toute</strong> la classe</td></tr>\n        <tr><td>pl.</td><td class=\"frex\"><strong>tous</strong> les étudiants</td><td class=\"frex\"><strong>toutes</strong> les étudiantes</td></tr></table>\n        <div class=\"tip\"><strong>tous / toutes</strong> + temps = chaque : <span class=\"frex\">tous les jours = chaque jour</span>. Dites <span class=\"frex\">tous les deux jours</span> (pas « chaque deux jours »).</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Pronom indéfini</div><div class=\"slide-title\">quelqu'un · quelque chose · quelque part</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">❓ Indéfinis</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>Pronom</th><th>Question</th><th>Contraire</th></tr>\n        <tr><td class=\"frex\">quelqu'un</td><td>Qui ?</td><td class=\"frex\">personne</td></tr>\n        <tr><td class=\"frex\">quelque chose</td><td>Quoi ?</td><td class=\"frex\">rien</td></tr>\n        <tr><td class=\"frex\">quelque part</td><td>Où ?</td><td class=\"frex\">nulle part</td></tr>\n        </table>\n        <ul>\n          <li>Suivi d'un adjectif → on ajoute <strong>de</strong> : <span class=\"frex\">quelqu'un <strong>de</strong> bien · quelque chose <strong>de</strong> nouveau · rien <strong>de</strong> spécial</span></li>\n          <li>Ces pronoms sont <strong>invariables</strong> : <span class=\"frex\">Paul / Marie est quelqu'un d'intelligent.</span></li>\n        </ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Adverbe</div><div class=\"slide-title\">Adjectif ou adverbe ?</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🎚 bon / bien</span></div><div class=\"slide-body\"><div class=\"rulebox\">L'adjectif modifie un <strong>nom</strong> ; l'adverbe modifie un <strong>verbe</strong>, un adjectif ou un adverbe.</div>\n        <table class=\"gtab\"><tr><th>Adjectif</th><th>Adverbe</th></tr>\n        <tr><td class=\"frex\"><strong>bon</strong> — un bon acteur</td><td class=\"frex\"><strong>bien</strong> — il joue bien</td></tr>\n        <tr><td class=\"frex\"><strong>rapide</strong> — ce train est rapide</td><td class=\"frex\"><strong>vite</strong> — il roule vite</td></tr>\n        <tr><td class=\"frex\">≠ mauvais</td><td class=\"frex\">≠ mal / lentement</td></tr>\n        </table>\n        <ul>\n          <li><strong>très</strong> modifie un adjectif/adverbe ; <strong>beaucoup</strong> modifie un verbe : <span class=\"frex\">très bavard · il parle beaucoup</span></li>\n          <li>Incompatibles : <span class=\"frex\">il dort beaucoup</span> (pas « très beaucoup ») · <span class=\"frex\">j'ai très froid</span> (pas « beaucoup froid »)</li>\n        </ul></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Adverbe · Formation</div><div class=\"slide-title\">Les adverbes en « -ment »</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">⚙️ -ment</span></div><div class=\"slide-body\"><table class=\"gtab\"><tr><th>Règle</th><th>Exemple</th></tr>\n        <tr><td>adj. en <strong>consonne</strong> → fém. + ment</td><td class=\"frex\">lent → lente<strong>ment</strong> · doux → douce<strong>ment</strong></td></tr>\n        <tr><td>adj. en <strong>voyelle</strong> → + ment</td><td class=\"frex\">poli → poli<strong>ment</strong> · absolu → absolu<strong>ment</strong> · vrai → vrai<strong>ment</strong></td></tr>\n        <tr><td><strong>-ent → -emment</strong></td><td class=\"frex\">récent → réc<strong>emment</strong></td></tr>\n        <tr><td><strong>-ant → -amment</strong></td><td class=\"frex\">suffisant → suffis<strong>amment</strong> · fréquent → fréqu<strong>emment</strong></td></tr>\n        </table>\n        <div class=\"tip\">🎵 <strong>-emment</strong> et <strong>-amment</strong> se prononcent tous deux « a-ment ». Cas particuliers : <span class=\"frex\">précis → précisément · énorme → énormément</span>. Mais <span class=\"frex\">gai → gaiement</span>.</div></div></div>", "<div class=\"content-slide\" style=\"--acc:#8B6FC0;--tint:#F1EAFA\"><div class=\"slide-hdr\" style=\"background:#F1EAFA;border-left:5px solid #8B6FC0\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#8B6FC0\">4</span><div><div class=\"slide-lnum\">④ Comparatif</div><div class=\"slide-title\">« mieux » et « meilleur »</div></div></div><span class=\"type-pill\" style=\"background:#8B6FC018;color:#8B6FC0;border:1.5px solid #8B6FC040\">🏆 Comparatif</span></div><div class=\"slide-body\"><div class=\"rulebox\">Les comparatifs de <strong>bon</strong> et <strong>bien</strong> sont <strong>irréguliers</strong>.</div>\n        <table class=\"gtab\"><tr><th>Base</th><th>Comparatif +</th><th>Superlatif</th></tr>\n        <tr><td class=\"frex\">bon (adj.)</td><td class=\"frex\"><strong>meilleur</strong> (s'accorde)</td><td class=\"frex\">le meilleur</td></tr>\n        <tr><td class=\"frex\">bien (adv.)</td><td class=\"frex\"><strong>mieux</strong></td><td class=\"frex\">le mieux</td></tr>\n        <tr><td class=\"frex\">mauvais</td><td class=\"frex\">plus mauvais / <strong>pire</strong></td><td class=\"frex\">le pire</td></tr>\n        </table>\n        <div class=\"rulebox frex\" style=\"margin-top:.4rem\">Le gâteau est <strong>meilleur</strong> que la tarte. · Julie cuisine <strong>mieux</strong> que Paula.<br>Cette tarte est <strong>meilleure</strong>. · Ces glaces sont <strong>les meilleures</strong>.</div>\n        </div></div>", "<div class=\"content-slide\" style=\"--acc:#3AABDC;--tint:#E8F4FB\"><div class=\"slide-hdr\" style=\"background:#E8F4FB;border-left:5px solid #3AABDC\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#3AABDC\">★</span><div><div class=\"slide-lnum\">Bilan</div><div class=\"slide-title\">À retenir</div></div></div><span class=\"type-pill\" style=\"background:#3AABDC18;color:#3AABDC;border:1.5px solid #3AABDC40\">🎯 Synthèse</span></div><div class=\"slide-body\"><ul>\n          <li><strong style=\"color:#3AABDC\">① Le nom</strong> — genre (terminaisons + exceptions) &amp; pluriel (-aux, -eux, -oux).</li>\n          <li><strong style=\"color:#22c55e\">② Déterminants</strong> — indéfini / défini / contracté / partitif, possessifs &amp; démonstratifs.</li>\n          <li><strong style=\"color:#EE5818\">③ Prépositions</strong> — lieu (à/en/au, dans/sur/sous), temps (jusqu'à, à partir de).</li>\n          <li><strong style=\"color:#8B6FC0\">④ Adjectifs &amp; adverbes</strong> — place, sens variable, formation en -ment, comparatifs.</li>\n        </ul>\n        <div class=\"tip\">📚 Le nom est au cœur de la phrase : bien le maîtriser, c'est bien construire tout le reste.</div></div></div>"];

const N=S.length;
let cur=0;

function clearPH(el){
  el.addEventListener('focus',()=>{const p=el.querySelector('.write-placeholder');if(p)p.style.display='none';});
  el.addEventListener('blur',()=>{const p=el.querySelector('.write-placeholder');if(p&&el.innerText.trim()==='')p.style.display='';});
}

function render(idx,smooth){
  cur=idx;
  const sw=document.getElementById('sw');
  sw.classList.add('fade');
  setTimeout(()=>{
    sw.innerHTML=S[cur];
    sw.querySelectorAll('[contenteditable]').forEach(clearPH);
    layout();sw.classList.remove('fade');
    document.getElementById('pf').style.width=((cur+1)/N*100)+'%';
    document.getElementById('pl').textContent=(cur+1)+' / '+N;
    document.getElementById('bp').disabled=cur===0;
    const bn=document.getElementById('bn');
    if(cur===N-1){bn.className='nav-btn done';bn.textContent='✓';bn.disabled=true;}
    else{bn.className='nav-btn';bn.textContent='→';bn.disabled=false;}
    layout();
    if(smooth!==false)window.scrollTo({top:0,behavior:inPresent()?'auto':'smooth'});
  },130);
}

function go(d){const n=cur+d;if(n>=0&&n<N)render(n);}

document.addEventListener('keydown',e=>{
  if(['ArrowRight',' '].includes(e.key)&&!e.target.isContentEditable&&e.target.tagName!=='INPUT'){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'&&!e.target.isContentEditable&&e.target.tagName!=='INPUT'){e.preventDefault();go(-1);}
});
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>55&&!document.activeElement.isContentEditable)go(dx<0?1:-1);
},{passive:true});

const zr=document.getElementById('zr');
const zl_el=document.getElementById('zl');
const sw_el=document.getElementById('sw');
function applyZoom(v){
  zl_el.textContent=v+'%';
  const scale=v/100;
  sw_el.style.transform='scale('+scale+')';
  sw_el.style.width=Math.round(920*(1/scale))+'px';
  sw_el.style.transformOrigin='top center';
}
zr.addEventListener('input',()=>applyZoom(parseInt(zr.value)));

/* ══ MODE PRÉSENTATION + CLAVIER FRANÇAIS + COMPTEUR DE MOTS ══ */
const SW=document.getElementById('sw'),SSW=document.getElementById('ssw'),DESIGN_W=1120;
const CARD=false;
let pz=1;
function inPresent(){return document.body.classList.contains('present');}
function restoreNormal(){
  SW.style.width='';SW.style.height='';SW.style.minHeight='';SW.style.maxWidth='';SW.style.flex='';
  SW.style.transform='';SW.style.transformOrigin='top center';SW.style.margin='';
  if(SSW){SSW.style.height='';SSW.style.width='';SSW.style.maxWidth='';SSW.style.overflow='';}
  if(typeof zr!=='undefined'&&zr)zr.dispatchEvent(new Event('input'));
}
function layout(){
  if(!inPresent()){restoreNormal();return;}
  const s=Math.min(window.innerWidth/DESIGN_W,2.4)*pz;
  const w=window.innerWidth/s;
  SW.style.maxWidth='none';SW.style.transformOrigin='top center';SW.style.margin='0 auto';
  SW.style.width=w+'px';SW.style.transform='scale('+s+')';
  if(CARD){
    SW.style.flex='none';SW.style.height=((window.innerHeight/s)-4)+'px';
    if(SSW){SSW.style.maxWidth='none';SSW.style.width='100%';SSW.style.height='100vh';SSW.style.overflow='hidden';}
  }else{
    SW.style.minHeight=((window.innerHeight/s)-4)+'px';
    if(SSW){SSW.style.maxWidth='none';SSW.style.width='100%';SSW.style.height=SW.getBoundingClientRect().height+'px';}
  }
}
function setSize(d){
  pz=Math.min(2.2,Math.max(.8,Math.round((pz+d*.1)*10)/10));
  const v=document.getElementById('szv');if(v)v.textContent=Math.round(pz*100)+'%';
  layout();
}
function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement;}
function toggleFS(){
  const d=document.documentElement;
  if(!document.body.classList.contains('present')){
    const r=d.requestFullscreen||d.webkitRequestFullscreen;
    if(r){try{const p=r.call(d);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    document.body.classList.add('present');
  }else{
    const x=document.exitFullscreen||document.webkitExitFullscreen;
    if(x){try{x.call(document);}catch(e){}}
    document.body.classList.remove('present');
  }
  setTimeout(layout,120);setTimeout(layout,450);
}
function onFsChange(){
  document.body.classList.toggle('present',!!fsElement());
  const b=document.getElementById('fsb');
  if(b)b.querySelector('.fs-txt').textContent=fsElement()?'Quitter':'Plein écran';
  setTimeout(layout,120);setTimeout(layout,450);
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);
window.addEventListener('resize',()=>layout());
document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable||e.target.tagName==='INPUT')return;
  if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFS();}
  if(e.key==='Escape'&&document.body.classList.contains('present')&&!fsElement()){document.body.classList.remove('present');layout();}
  if(inPresent()){
    if(e.key==='+'||e.key==='='){e.preventDefault();setSize(1);}
    if(e.key==='-'||e.key==='_'){e.preventDefault();setSize(-1);}
    if(e.key==='0'){e.preventDefault();pz=1;const v=document.getElementById('szv');if(v)v.textContent='100%';layout();}
  }else if(typeof zr!=='undefined'&&zr){
    if(e.key==='+'||e.key==='='){e.preventDefault();zr.value=Math.min(+zr.max,+zr.value+10);zr.dispatchEvent(new Event('input'));}
    if(e.key==='-'||e.key==='_'){e.preventDefault();zr.value=Math.max(+zr.min,+zr.value-10);zr.dispatchEvent(new Event('input'));}
    if(e.key==='0'){e.preventDefault();zr.value=100;zr.dispatchEvent(new Event('input'));}
  }
});
/* ── clavier d'accents flottant : toutes les zones de saisie ── */
const ACC=['é','è','ê','ë','à','â','î','ï','ô','û','ù','ç','œ','æ','|','É','È','À','Ç','|','« ',' »','’'];
const accBar=document.createElement('div');accBar.className='acc-bar';
const accCount=document.createElement('span');accCount.className='acc-count';
let curEd=null;
ACC.forEach(ch=>{
  if(ch==='|'){const s=document.createElement('span');s.className='acc-sep';accBar.appendChild(s);return;}
  const b=document.createElement('button');b.type='button';b.className='acc-key';b.textContent=ch.trim()||ch;
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('click',()=>{
    if(!curEd)return;
    const p=curEd.querySelector?curEd.querySelector('.write-placeholder'):null;if(p)p.style.display='none';
    curEd.focus();
    if(curEd.tagName==='INPUT'||curEd.tagName==='TEXTAREA'){
      const s=curEd.selectionStart||0,e2=curEd.selectionEnd||0;
      curEd.value=curEd.value.slice(0,s)+ch+curEd.value.slice(e2);
      curEd.selectionStart=curEd.selectionEnd=s+ch.length;
    }else{document.execCommand('insertText',false,ch);}
    updCount();
  });
  accBar.appendChild(b);
});
accBar.appendChild(accCount);
document.body.appendChild(accBar);
function edText(el){
  if(el.tagName==='INPUT'||el.tagName==='TEXTAREA')return el.value||'';
  const p=el.querySelector('.write-placeholder');
  let t=el.innerText||'';
  if(p&&p.offsetParent!==null&&p.innerText)t=t.split(p.innerText).join('');
  return t;
}
function updCount(){
  if(!curEd)return;
  const m=edText(curEd).match(/[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*/g);
  const n=m?m.length:0;
  const mn=parseInt(curEd.dataset.min||0),mx=parseInt(curEd.dataset.max||0);
  accCount.className='acc-count';
  if(mn&&mx){
    accCount.textContent=n+' / '+mn+'–'+mx+' mots';
    const st=(n===0?'':(n<mn?'under':(n>mx?'over':'ok')));
    if(st)accCount.classList.add(st);
  }else{accCount.textContent=n+(n>1?' mots':' mot');}
}
function edOf(t){return t&&t.closest?t.closest('[contenteditable],input[type=text],textarea'):null;}
document.addEventListener('focusin',e=>{const ed=edOf(e.target);if(ed){curEd=ed;accBar.classList.add('on');updCount();}});
/* en plein écran : empêche le focus d'une zone de saisie de faire remonter la diapo */
document.addEventListener('focusin',()=>{
  if(!inPresent())return;
  setTimeout(()=>{document.querySelectorAll('.stage,.slide-scale-wrap').forEach(el=>{el.scrollTop=0;el.scrollLeft=0;});},0);
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(!edOf(document.activeElement))accBar.classList.remove('on');},160);});
document.addEventListener('input',e=>{const ed=edOf(e.target);if(ed){curEd=ed;updCount();}});

render(0,false);layout();

</script>
</body></html>
