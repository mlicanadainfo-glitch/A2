<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Par ici A2 – Vocabulaire</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@300;400;600&display=swap');
  :root {
    --bg:#f0f7fb;
    --panel:#fff;
    --blue:#4BBCE8; --blue-d:#2fa8d8; --blue-l:#d6f0fb;
    --green:#5CB88A; --green-d:#44a072; --green-l:#d4f0e3;
    --muted:#8a9aaa; --bdr:#c8e8f5; --text:#3a3a3a;
    --card-bg:#fff;
    --shadow:rgba(75,188,232,.13);
    --navy:#1b3a6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  header{background:#fff;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--blue);box-shadow:0 2px 8px rgba(75,188,232,.15);flex-wrap:wrap;gap:8px;}
  .hdr-left{display:flex;align-items:center;gap:10px;}
  .hdr-logo{height:40px;width:auto;}
  .hdr-title{font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:800;color:var(--text);letter-spacing:.3px;}
  .hdr-title span{color:var(--blue-d);}
  .hdr-right{display:flex;align-items:center;gap:8px;}
  .pill{background:var(--blue-l);color:var(--blue-d);border:1px solid var(--bdr);border-radius:999px;padding:4px 13px;font-size:.77rem;font-weight:800;white-space:nowrap;}

  .controls{background:#fff;border-bottom:2px solid var(--bdr);padding:9px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .controls input[type=text]{border:1.5px solid var(--bdr);border-radius:20px;padding:6px 14px;font-family:inherit;font-size:.85rem;font-weight:600;background:#f8fcff;color:var(--text);outline:none;flex:1;min-width:150px;}
  .controls input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(75,188,232,.12);}
  .btn{border:none;border-radius:20px;padding:7px 16px;font-family:inherit;font-size:.84rem;font-weight:800;cursor:pointer;transition:transform .12s,box-shadow .15s;}
  .btn:hover{transform:translateY(-1px);}
  .btn-ghost{background:transparent;color:var(--blue-d);border:1.5px solid var(--blue);}
  .btn-ghost:hover{background:var(--blue-l);}
  .toggle-label{display:flex;align-items:center;gap:6px;font-size:.81rem;font-weight:700;cursor:pointer;color:var(--muted);}
  .toggle-label input{accent-color:var(--blue-d);}

  .prog-wrap{background:var(--bdr);border-radius:999px;height:5px;margin:9px 16px 0;overflow:hidden;}
  .prog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s;}
  .prog-label{font-size:.73rem;font-weight:700;color:var(--muted);padding:3px 16px 6px;}

  .ep-nav{background:#fff;border-bottom:2px solid var(--bdr);padding:8px 16px 0;display:flex;gap:3px;overflow-x:auto;scrollbar-width:thin;}
  .ep-tab{border:none;border-radius:8px 8px 0 0;padding:6px 11px;font-family:inherit;font-size:.76rem;font-weight:800;cursor:pointer;white-space:nowrap;color:#fff;opacity:.42;transition:opacity .18s;flex-shrink:0;}
  .ep-tab.active{opacity:1;}

  .grid-area{padding:12px 14px 80px;}

  .ep-sec{margin-bottom:6px;}
  .ep-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;user-select:none;padding:10px 14px;background:#fff;border-radius:12px;border:1px solid var(--bdr);box-shadow:0 2px 8px var(--shadow);}
  .ep-hdr:hover{background:var(--blue-l);}
  .ep-badge{width:33px;height:33px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;color:#fff;flex-shrink:0;}
  .ep-title{font-family:'Nunito',sans-serif;font-size:1.02rem;font-weight:800;color:var(--text);}
  .ep-sub{font-size:.74rem;font-weight:600;color:var(--muted);margin-top:1px;}
  .ep-count{margin-left:auto;font-size:.74rem;font-weight:800;color:var(--blue-d);background:var(--blue-l);border-radius:999px;padding:2px 9px;flex-shrink:0;}
  .caret{font-size:.62rem;color:#bbb;transition:transform .2s;flex-shrink:0;}
  .ep-sec.collapsed .caret{transform:rotate(-90deg);}
  .ep-sec.collapsed .themes-wrap{display:none;}

  .themes-wrap{padding:0 2px 10px;}
  .theme-group{margin-bottom:10px;}
  .theme-label{font-size:.7rem;font-weight:900;letter-spacing:.9px;text-transform:uppercase;color:var(--blue-d);padding:4px 4px 7px;display:flex;align-items:center;gap:6px;}
  .theme-label::after{content:'';flex:1;height:1px;background:var(--bdr);}
  .cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:8px;}

  .card{background:var(--card-bg);border-radius:11px;padding:10px 12px 9px;box-shadow:0 2px 8px var(--shadow);cursor:pointer;transition:transform .14s,box-shadow .14s;border:1px solid var(--bdr);border-left:4px solid var(--bdr);position:relative;min-height:66px;display:flex;flex-direction:column;justify-content:space-between;}
  .card:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(75,188,232,.22);border-left-color:var(--blue);}
  .card.known{background:var(--green-l);border-left-color:var(--green);opacity:.78;}
  .card .fr{font-weight:800;font-size:.87rem;line-height:1.3;color:var(--text);padding-right:18px;}
  .card .zh{font-size:.76rem;color:#5a7a8a;margin-top:4px;display:none;line-height:1.35;}
  .card.revealed .zh{display:block;}
  .card .kbtn{position:absolute;top:6px;right:7px;background:none;border:none;font-size:.92rem;cursor:pointer;opacity:.18;transition:opacity .14s;padding:0;line-height:1;}
  .card:hover .kbtn,.card.known .kbtn{opacity:1;}

  .no-results{padding:40px;text-align:center;color:var(--muted);font-weight:700;background:var(--panel);border-radius:12px;border:1px solid var(--bdr);}

  .saison-banner{font-size:.68rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px 2px;color:var(--muted);}

  .fullscreen-btn{
    position:fixed;bottom:1.2rem;right:1.2rem;z-index:9999;
    padding:7px 14px;border-radius:20px;
    background:var(--navy);border:2px solid rgba(255,255,255,.3);
    color:#fff;font-size:12px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;
    box-shadow:0 3px 16px rgba(27,58,107,.45);
    transition:background .15s,transform .1s;
    letter-spacing:.03em;
  }
  .fullscreen-btn:hover{background:var(--blue-d);transform:translateY(-1px)}

  @media(max-width:480px){.cards-row{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));}}
</style>
</head>

const SVG_EXPAND='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 6V1H6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 1H15V6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 10V15H10" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 15H1V10" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_EXIT='<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1L13 13M13 1L1 13" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>';

function toggleFS(){
  const btn=document.getElementById('fs-btn');
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    const el=document.documentElement;
    if(el.requestFullscreen)el.requestFullscreen();
    else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  }else{
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
  }
}
function updateFSBtn(){
  const btn=document.getElementById('fs-btn');
  const inFS=!!(document.fullscreenElement||document.webkitFullscreenElement);
  btn.innerHTML=inFS?SVG_EXIT+' Exit Fullscreen':SVG_EXPAND+' Fullscreen';
}
document.addEventListener('fullscreenchange',updateFSBtn);
document.addEventListener('webkitfullscreenchange',updateFSBtn);
document.addEventListener('keydown',e=>{
  if((e.key==='f'||e.key==='F')&&document.activeElement.tagName!=='INPUT')toggleFS();
});

let known=new Set(),showTr=false,searchQ='',activeEp='all';
const save=()=>{try{localStorage.setItem('parici_a2_known',JSON.stringify([...known]));}catch(e){}}
const load=()=>{try{const d=localStorage.getItem('parici_a2_known');if(d)known=new Set(JSON.parse(d));}catch(e){}}
const cid=(en,ti,wi)=>`e${en}_t${ti}_w${wi}`;

function buildNav(){
  const nav=document.getElementById('epNav');
  const mk=(label,ep,bg)=>{
    const b=document.createElement('button');
    b.className='ep-tab'+(activeEp===ep?' active':'');
    b.style.background=bg;
    b.textContent=label;
    b.onclick=()=>{activeEp=ep;document.querySelectorAll('.ep-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();};
    nav.appendChild(b);
  };
  mk('Tout','all','#2fa8d8');
  EPISODES.forEach(ep=>mk('Ép. '+ep.num,ep.num,ep.color));
}

function matches(w){
  if(!searchQ)return true;
  return w.fr.toLowerCase().includes(searchQ)||w.zh.includes(searchQ);
}

function render(){
  const q=searchQ.toLowerCase();
  const area=document.getElementById('gridArea');
  area.innerHTML='';
  let totalShown=0;
  const list=activeEp==='all'?EPISODES:EPISODES.filter(e=>e.num===activeEp);
  let lastSaison='';
  list.forEach((ep,ei)=>{
    const sec=document.createElement('div');
    sec.className='ep-sec';
    const cnt=ep.themes.reduce((a,th)=>a+th.words.filter(w=>matches(w)).length,0);
    if(!cnt)return;
    totalShown+=cnt;
    if(activeEp==='all'&&ep.saison!==lastSaison){
      lastSaison=ep.saison;
      const banner=document.createElement('div');
      banner.className='saison-banner';
      banner.textContent='— '+ep.saison+' —';
      area.appendChild(banner);
    }
    const hdr=document.createElement('div');
    hdr.className='ep-hdr';
    hdr.innerHTML=`<div class="ep-badge" style="background:${ep.color}">${ep.num}</div><div><div class="ep-title">${ep.title}</div><div class="ep-sub">Épisode ${ep.num} · ${ep.saison}</div></div><div class="ep-count">${cnt} mots</div><span class="caret">▼</span>`;
    hdr.onclick=()=>sec.classList.toggle('collapsed');
    sec.appendChild(hdr);
    const wrap=document.createElement('div');
    wrap.className='themes-wrap';
    ep.themes.forEach((th,ti)=>{
      const mw=th.words.filter(w=>matches(w));
      if(!mw.length)return;
      const tg=document.createElement('div');
      tg.className='theme-group';
      const lbl=document.createElement('div');
      lbl.className='theme-label';
      lbl.textContent=th.label;
      tg.appendChild(lbl);
      const row=document.createElement('div');
      row.className='cards-row';
      mw.forEach((w,wi)=>{
        const origWi=th.words.indexOf(w);
        const id=cid(ep.num,ti,origWi);
        const isK=known.has(id);
        const c=document.createElement('div');
        c.className='card'+(isK?' known':'')+(showTr?' revealed':'');
        c.dataset.id=id;
        c.innerHTML=`<div class="fr">${w.fr}</div><div class="zh">${w.zh}</div><button class="kbtn" title="Mémoriser">${isK?'✅':'☐'}</button>`;
        c.onclick=e=>{
          if(e.target.classList.contains('kbtn'))return;
          c.classList.toggle('revealed');
        };
        c.querySelector('.kbtn').onclick=e=>{
          e.stopPropagation();
          if(known.has(id))known.delete(id);else known.add(id);
          save();render();
        };
        row.appendChild(c);
      });
      tg.appendChild(row);
      wrap.appendChild(tg);
    });
    sec.appendChild(wrap);
    area.appendChild(sec);
  });
  if(!totalShown)area.innerHTML='<div class="no-results">Aucun résultat pour « '+searchQ+' »</div>';
  updateStats();
}

function updateStats(){
  const total=EPISODES.reduce((a,ep)=>a+ep.themes.reduce((b,th)=>b+th.words.length,0),0);
  const n=known.size;
  document.getElementById('knownStat').textContent='✓ '+n+' mémorisés';
  document.getElementById('totalStat').textContent=total+' mots';
  const pct=total>0?Math.round(n/total*100):0;
  document.getElementById('progFill').style.width=Math.min(pct,100)+'%';
  document.getElementById('progLabel').textContent=n+' / '+total+' mémorisés ('+pct+'%)';
}

function resetAll(){
  if(!confirm('Réinitialiser tous les mots mémorisés ?'))return;
  known.clear();save();render();
}

document.getElementById('searchBox').oninput=e=>{searchQ=e.target.value;render();};
document.getElementById('showTrans').onchange=e=>{
  showTr=e.target.checked;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('revealed',showTr));
};

load();buildNav();render();
</script>
